<!doctype html>

<script>/* silent-deny: never show a camera/mic/screen permission prompt in this game */
(function(){try{var md=navigator.mediaDevices;if(!md)return;
var deny=function(){return Promise.reject(new DOMException('Permission denied','NotAllowedError'));};
if(md.getUserMedia)md.getUserMedia=deny;
if(md.getDisplayMedia)md.getDisplayMedia=deny;
if(md.enumerateDevices)md.enumerateDevices=function(){return Promise.resolve([]);};
}catch(e){}})();</script>

  <body>
    <div style="width: 100vw; height: 100vh">
      <div id="game"></div>
      <button id="startButton">PLAY</button>
    </div>
    <script>
      function startGame() {
        document.getElementById("startButton").style.display = "none";
        EJS_player = "#game";
        EJS_core = "mgba";
        EJS_color = "#000000";
        EJS_startOnLoaded = true;
        EJS_pathtodata = "https://cdn.jsdelivr.net/gh/bubblfan/emu@master/";
        EJS_gameUrl =
          "https://cdn.jsdelivr.net/gh/deformed-steve/emujsgames@main/roms/Pok�mon Emerald Rush Edition (2.0).gba";

        var script = document.createElement("script");
        script.src = EJS_pathtodata + "/loader.js";
        document.body.appendChild(script);
      }
      document
        .getElementById("startButton")
        .addEventListener("click", startGame);
    </script>
