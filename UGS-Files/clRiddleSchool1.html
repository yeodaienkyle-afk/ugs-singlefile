<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riddle School 1</title>
<link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#game{position:fixed;inset:0;display:block}
#ugsl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#c9cede;font:13px system-ui,sans-serif}
</style></head>
<body>
<div id="ugsl">loading Riddle School 1...</div>
<div id="game"></div>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", letterbox: "on", scale: "showAll", splashScreen: false };
function ugBoot() {
  var l = document.getElementById("ugsl");
  if (!window.RufflePlayer || !window.RufflePlayer.newest) {
    if (l) l.textContent = "player failed to load - refresh";
    return;
  }
  var p = window.RufflePlayer.newest().createPlayer();
  p.style.width = "100%"; p.style.height = "100%";
  document.getElementById("game").appendChild(p);
  p.load("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/Holy-Moly-Rips@6fb555f8b6102654fd4d62fef74db1680826f70b/Riddle%20School%20And%20Transfer/RS%201/314680_Riddle_School.swf");
  setTimeout(function () { if (l) l.style.display = "none"; }, 2500);
}
if (document.readyState === "complete") { ugBoot(); } else { window.addEventListener("load", ugBoot); }
  p.load("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/Holy-Moly-Rips@6fb555f8b6102654fd4d62fef74db1680826f70b/Riddle%20School%20And%20Transfer/RS%201/314680_Riddle_School.swf");
  setTimeout(function () { if (l) l.style.display = "none"; }, 4000);
});
</script>
</body></html>
