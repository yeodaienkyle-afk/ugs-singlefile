<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boggle</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #121216;
      color: #f3f4f6;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 1rem;
    }

    .container {
      max-width: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #ef4444);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
      margin-bottom: 0.2rem;
    }

    .how-to-play {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 0.5rem;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e24;
      padding: 0.75rem 1.25rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      border: 1px solid #2d2d38;
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .timer-warning {
      color: #f59e0b !important;
    }

    .timer-danger {
      color: #ef4444 !important;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: #2563eb;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-secondary {
      background: #374151;
      color: #e5e7eb;
    }

    .btn-secondary:hover {
      background: #4b5563;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      aspect-ratio: 1;
      background: #1e1e24;
      padding: 12px;
      border-radius: 16px;
      border: 2px solid #2d2d38;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

    .die {
      background: linear-gradient(145deg, #2d2d38, #22222a);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.1);
      border: 2px solid #374151;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }

    .die-letter {
      font-size: 2rem;
      font-weight: 800;
      color: #f3f4f6;
      transition: transform 0.2s ease;
    }

    .die.selected {
      background: linear-gradient(145deg, #f59e0b, #d97706);
      border-color: #fbbf24;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5);
    }

    .die.selected .die-letter {
      color: #ffffff;
    }

    .die.highlighted {
      background: linear-gradient(145deg, #3b82f6, #1d4ed8);
      border-color: #60a5fa;
    }

    .die.last-selected {
      border-color: #ffffff;
    }

    .input-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .current-word-display {
      min-height: 48px;
      background: #1e1e24;
      border: 2px solid #374151;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: #fbbf24;
    }

    .type-input {
      background: transparent;
      border: none;
      color: #fbbf24;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 3px;
      width: 100%;
      outline: none;
      text-transform: uppercase;
    }

    .controls-row {
      display: flex;
      gap: 0.5rem;
      width: 100%;
    }

    .controls-row .btn {
      flex: 1;
    }

    .status-msg {
      min-height: 24px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      transition: opacity 0.2s ease;
    }

    .status-success { color: #10b981; }
    .status-error { color: #ef4444; }
    .status-info { color: #38bdf8; }

    .found-section {
      width: 100%;
      background: #1e1e24;
      border-radius: 12px;
      border: 1px solid #2d2d38;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: 180px;
    }

    .found-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #9ca3af;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .found-words-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      overflow-y: auto;
      max-height: 120px;
      padding-right: 4px;
    }

    .word-badge {
      background: #2b2b36;
      border: 1px solid #3d3d4e;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .word-badge .pts {
      color: #10b981;
      font-size: 0.75rem;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal {
      background: #1e1e24;
      border: 2px solid #374151;
      border-radius: 16px;
      padding: 2rem;
      max-width: 380px;
      width: 90%;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }

    .modal h2 {
      font-size: 1.8rem;
      color: #fbbf24;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>BOGGLE</h1>
      <p class="how-to-play">Click adjacent letters or type words to find as many words as you can in 2 minutes!</p>
    </header>

    <div class="top-bar">
      <div class="stat-box">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="timer-display">02:00</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Score</span>
        <span class="stat-value" id="score-display">0</span>
      </div>
      <button class="btn btn-secondary" id="restart-btn">New Round</button>
    </div>

    <div class="grid" id="dice-grid"></div>

    <div class="input-section">
      <div class="current-word-display">
        <input type="text" id="type-input" class="type-input" placeholder="TYPE OR CLICK..." autocomplete="off" spellcheck="false" />
      </div>
      <div class="controls-row">
        <button class="btn btn-secondary" id="clear-btn">Clear</button>
        <button class="btn" id="submit-btn">Submit Word</button>
      </div>
      <div class="status-msg" id="status-msg"></div>
    </div>

    <div class="found-section">
      <div class="found-header">
        <span>Found Words (<span id="found-count">0</span>)</span>
        <span>Points</span>
      </div>
      <div class="found-words-list" id="found-words-list"></div>
    </div>
  </div>

  <div class="overlay hidden" id="game-over-modal">
    <div class="modal">
      <h2>TIME'S UP!</h2>
      <p>Final Score: <strong id="final-score" style="color: #38bdf8; font-size: 1.4rem;">0</strong></p>
      <p>Words Found: <strong id="final-count" style="color: #10b981; font-size: 1.2rem;">0</strong></p>
      <button class="btn" id="modal-restart-btn" style="width: 100%;">Play Again</button>
    </div>
  </div>

      ];

      const WORD_SET = new Set(WORD_LIST);

      let gridLetters = [];
      let gridRotations = [];
      let selectedIndices = [];
      let foundWords = [];
      let score = 0;
      let timeLeft = 120;
      let timerInterval = null;
      let isGameOver = false;

      // DOM elements
      const diceGridEl = document.getElementById('dice-grid');
      const timerDisplayEl = document.getElementById('timer-display');
      const scoreDisplayEl = document.getElementById('score-display');
      const typeInputEl = document.getElementById('type-input');
      const clearBtn = document.getElementById('clear-btn');
      const submitBtn = document.getElementById('submit-btn');
      const restartBtn = document.getElementById('restart-btn');
      const statusMsgEl = document.getElementById('status-msg');
      const foundWordsListEl = document.getElementById('found-words-list');
      const foundCountEl = document.getElementById('found-count');
      const gameOverModal = document.getElementById('game-over-modal');
      const finalScoreEl = document.getElementById('final-score');
      const finalCountEl = document.getElementById('final-count');
      const modalRestartBtn = document.getElementById('modal-restart-btn');

      // Helper: check adjacency on 4x4 grid
      function isAdjacent(idx1, idx2) {
        const r1 = Math.floor(idx1 / 4), c1 = idx1 % 4;
        const r2 = Math.floor(idx2 / 4), c2 = idx2 % 4;
        return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1 && !(r1 === r2 && c1 === c2);
      }

      // Find path on grid using DFS
      function findPath(word, letters) {
        const w = word.toUpperCase();
        const len = w.length;

        function dfs(currIdx, charPos, visited) {
          if (charPos === len) return visited;
          const r = Math.floor(currIdx / 4), c = currIdx % 4;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < 4 && nc >= 0 && nc < 4) {
                const nextIdx = nr * 4 + nc;
                if (!visited.includes(nextIdx) && letters[nextIdx] === w[charPos]) {
                  const res = dfs(nextIdx, charPos + 1, [...visited, nextIdx]);
                  if (res) return res;
                }
              }
            }
          }
          return null;
        }

        for (let i = 0; i < 16; i++) {
          if (letters[i] === w[0]) {
            const path = dfs(i, 1, [i]);
            if (path) return path;
          }
        }
        return null;
      }

      // Scoring logic (3/4: 1, 5: 2, 6: 3, 7+: 5)
      function getPoints(length) {
        if (length < 3) return 0;
        if (length === 3 || length === 4) return 1;
        if (length === 5) return 2;
        if (length === 6) return 3;
        return 5;
      }

      function startNewRound() {
        if (timerInterval) clearInterval(timerInterval);

        // Shuffle dice
        const shuffledDice = [...BOGGLE_DICE].sort(() => Math.random() - 0.5);
        gridLetters = [];
        gridRotations = [];

        const angles = [0, 90, 180, 270];
        shuffledDice.forEach(die => {
          const randLetter = die[Math.floor(Math.random() * die.length)];
          gridLetters.push(randLetter);
          gridRotations.push(angles[Math.floor(Math.random() * angles.length)]);
        });

        selectedIndices = [];
        foundWords = [];
        score = 0;
        timeLeft = 120;
        isGameOver = false;

        scoreDisplayEl.textContent = '0';
        foundCountEl.textContent = '0';
        foundWordsListEl.innerHTML = '';
        typeInputEl.value = '';
        statusMsgEl.textContent = '';
        gameOverModal.classList.add('hidden');

        renderGrid();
        updateTimerDisplay();

        timerInterval = setInterval(() => {
          timeLeft--;
          updateTimerDisplay();
          if (timeLeft <= 0) {
            endGame();
          }
        }, 1000);
      }

      function updateTimerDisplay() {
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        const str = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        timerDisplayEl.textContent = str;

        if (timeLeft <= 10) {
          timerDisplayEl.className = 'stat-value timer-danger';
        } else if (timeLeft <= 30) {
          timerDisplayEl.className = 'stat-value timer-warning';
        } else {
          timerDisplayEl.className = 'stat-value';
        }
      }

      function renderGrid() {
        diceGridEl.innerHTML = '';
        for (let i = 0; i < 16; i++) {
          const die = document.createElement('div');
          die.className = 'die';
          die.dataset.index = i;

          const letterSpan = document.createElement('span');
          letterSpan.className = 'die-letter';
          letterSpan.textContent = gridLetters[i];
          letterSpan.style.transform = `rotate(${gridRotations[i]}deg)`;

          die.appendChild(letterSpan);

          if (selectedIndices.includes(i)) {
            die.classList.add('selected');
            if (selectedIndices[selectedIndices.length - 1] === i) {
              die.classList.add('last-selected');
            }
          }

          die.addEventListener('click', () => handleDieClick(i));
          diceGridEl.appendChild(die);
        }
      }

      function handleDieClick(index) {
        if (isGameOver) return;

        const lastIdx = selectedIndices[selectedIndices.length - 1];

        if (selectedIndices.includes(index)) {
          // If clicking the last selected, unselect it
          if (lastIdx === index) {
            selectedIndices.pop();
          }
        } else {
          // If empty selection or adjacent to last selected
          if (selectedIndices.length === 0 || isAdjacent(lastIdx, index)) {
            selectedIndices.push(index);
          } else {
            // Restart selection from clicked die
            selectedIndices = [index];
          }
        }

        const currentWord = selectedIndices.map(i => gridLetters[i]).join('');
        typeInputEl.value = currentWord;
        renderGrid();
      }

      function updateHighlightFromInput() {
        if (isGameOver) return;
        const typed = typeInputEl.value.trim().toUpperCase();
        if (!typed) {
          selectedIndices = [];
          renderGrid();
          return;
        }

        const path = findPath(typed, gridLetters);
        if (path) {
          selectedIndices = path;
          renderGrid();
        } else {
          // Visual highlight clear if invalid path
          selectedIndices = [];
          renderGrid();
        }
      }

      function submitCurrentWord() {
        if (isGameOver) return;
        const word = typeInputEl.value.trim().toUpperCase();

        if (word.length < 3) {
          showStatus('Word must be 3+ letters', 'error');
          return;
        }

        if (foundWords.includes(word)) {
          showStatus(`"${word}" already found!`, 'error');
          return;
        }

        if (!WORD_SET.has(word)) {
          showStatus(`"${word}" not in word list`, 'error');
          return;
        }

        const path = findPath(word, gridLetters);
        if (!path) {
          showStatus(`"${word}" cannot be formed on grid`, 'error');
          return;
        }

        // Valid word!
        const pts = getPoints(word.length);
        score += pts;
        foundWords.push(word);

        scoreDisplayEl.textContent = score;
        foundCountEl.textContent = foundWords.length;

        const badge = document.createElement('div');
        badge.className = 'word-badge';
        badge.innerHTML = `${word} <span class="pts">+${pts}</span>`;
        foundWordsListEl.prepend(badge);

        showStatus(`+${pts} pts for "${word}"!`, 'success');

        selectedIndices = [];
        typeInputEl.value = '';
        renderGrid();
      }

      function showStatus(text, type) {
        statusMsgEl.textContent = text;
        statusMsgEl.className = `status-msg status-${type}`;
      }

      function endGame() {
        isGameOver = true;
        if (timerInterval) clearInterval(timerInterval);
        finalScoreEl.textContent = score;
        finalCountEl.textContent = foundWords.length;
        gameOverModal.classList.remove('hidden');
      }

      // Event listeners
      typeInputEl.addEventListener('input', () => {
        typeInputEl.value = typeInputEl.value.toUpperCase();
        updateHighlightFromInput();
      });

      typeInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          submitCurrentWord();
        }
      });

      submitBtn.addEventListener('click', submitCurrentWord);

      clearBtn.addEventListener('click', () => {
        selectedIndices = [];
        typeInputEl.value = '';
        renderGrid();
        statusMsgEl.textContent = '';
      });

      restartBtn.addEventListener('click', startNewRound);
      modalRestartBtn.addEventListener('click', startNewRound);

      // Start on load
      startNewRound();
    })();
  </script>
