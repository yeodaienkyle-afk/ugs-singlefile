<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Time Tester</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      user-select: none;
      -webkit-user-select: none;
    }
    h1 {
      font-size: 2rem;
      color: #00ffcc;
      text-shadow: 0 0 10px #00ffcc;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      background: #151a24;
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid #00ffcc44;
      width: 100%;
      max-width: 600px;
      justify-content: space-around;
      font-size: 0.95rem;
    }
    .stat-val { font-weight: bold; font-size: 1.2rem; font-family: monospace; color: #00ffcc; }

    .test-box {
      width: 100%;
      max-width: 600px;
      aspect-ratio: 16 / 10;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      cursor: pointer;
      transition: background-color 0.15s, border-color 0.15s;
      border: 4px solid #333;
    }

    .test-box.idle {
      background: #1c1c28;
      border-color: #00ffcc;
    }
    .test-box.waiting {
      background: #a00033;
      border-color: #ff0055;
    }
    .test-box.ready {
      background: #00b359;
      border-color: #00ff77;
    }
    .test-box.early {
      background: #661100;
      border-color: #ff4400;
    }

    .box-title {
      font-size: 2.8rem;
      font-weight: bold;
      margin-bottom: 10px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .box-sub {
      font-size: 1.2rem;
      color: #ddd;
    }

    .history-panel {
      width: 100%;
      max-width: 600px;
      margin-top: 20px;
      background: #151a24;
      border-radius: 8px;
      padding: 15px;
      border: 1px solid #222c3a;
    }
    .history-title { font-size: 0.85rem; color: #888; text-transform: uppercase; margin-bottom: 10px; }
    .history-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tag {
      background: #202738;
      border-radius: 6px;
      padding: 6px 12px;
      font-family: monospace;
      font-size: 1rem;
      border: 1px solid #00ffcc33;
    }
  </style>
</head>
<body>

  <h1>Reaction Time Tester</h1>

  <div class="stats-bar">
    <div>Best: <span class="stat-val" id="valBest">-- ms</span></div>
    <div>Average: <span class="stat-val" id="valAvg">-- ms</span></div>
    <div>Attempts: <span class="stat-val" id="valCount">0</span></div>
  </div>

  <div class="test-box idle" id="testBox">
    <div class="box-title" id="boxTitle">CLICK TO START</div>
    <div class="box-sub" id="boxSub">When red turns GREEN, click/tap as fast as you can!</div>
  </div>

  <div class="history-panel">
    <div class="history-title">Last 5 Attempts</div>
    <div class="history-tags" id="historyTags"></div>
  </div>

<script>
(function() {
  const testBox = document.getElementById('testBox');
  const boxTitle = document.getElementById('boxTitle');
  const boxSub = document.getElementById('boxSub');

  const valBest = document.getElementById('valBest');
  const valAvg = document.getElementById('valAvg');
  const valCount = document.getElementById('valCount');
  const historyTags = document.getElementById('historyTags');

  let state = 'IDLE'; // IDLE, WAITING, READY, RESULT, EARLY
  let timerId = null;
  let startTime = 0;
  let attempts = [];

  let bestTime = null;
  try {
    let saved = localStorage.getItem('reaction_best_ms');
    if (saved) bestTime = parseInt(saved, 10);
  } catch(e) {}

  let audioCtx = null;
  function playSound(freq, duration=0.1) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function updateHUD() {
    valBest.textContent = bestTime ? `${bestTime} ms` : '-- ms';

    if (attempts.length > 0) {
      let sum = attempts.reduce((a, b) => a + b, 0);
      let avg = Math.round(sum / attempts.length);
      valAvg.textContent = `${avg} ms`;
    } else {
      valAvg.textContent = '-- ms';
    }

    valCount.textContent = attempts.length;

    historyTags.innerHTML = '';
    for (let ms of attempts.slice(-5)) {
      let span = document.createElement('span');
      span.className = 'tag';
      span.textContent = `${ms} ms`;
      historyTags.appendChild(span);
    }
  }

  function getTaunt(ms) {
    if (ms < 180) return "⚡ GODLIKE REFLEXES!";
    if (ms < 230) return "🚀 Super fast!";
    if (ms < 300) return "👍 Nice average score!";
    if (ms < 420) return "🐢 A bit sluggish!";
    return "🦥 Did you fall asleep?";
  }

  function handleInteraction() {
    if (state === 'IDLE' || state === 'RESULT' || state === 'EARLY') {
      // Start test
      state = 'WAITING';
      testBox.className = 'test-box waiting';
      boxTitle.textContent = "WAIT FOR GREEN...";
      boxSub.textContent = "Hold on tight, don't click early!";

      let delay = 1500 + Math.random() * 3500;
      timerId = setTimeout(() => {
        state = 'READY';
        startTime = performance.now();
        testBox.className = 'test-box ready';
        boxTitle.textContent = "CLICK NOW!";
        boxSub.textContent = "TAP FAST!";
        playSound(880, 0.15);
      }, delay);

    } else if (state === 'WAITING') {
      // Too early!
      clearTimeout(timerId);
      state = 'EARLY';
      testBox.className = 'test-box early';
      boxTitle.textContent = "TOO EARLY!";
      boxSub.textContent = "You clicked before green. Tap to try again!";
      playSound(200, 0.2);

    } else if (state === 'READY') {
      // Success!
      let elapsed = Math.round(performance.now() - startTime);
      playSound(660, 0.12);

      state = 'RESULT';
      testBox.className = 'test-box idle';
      boxTitle.textContent = `${elapsed} ms`;
      boxSub.textContent = `${getTaunt(elapsed)} (Click to retry)`;

      attempts.push(elapsed);
      if (!bestTime || elapsed < bestTime) {
        bestTime = elapsed;
        try { localStorage.setItem('reaction_best_ms', bestTime.toString()); } catch(e) {}
      }

      updateHUD();
    }
  }

  testBox.addEventListener('click', handleInteraction);
  window.addEventListener('keydown', (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      handleInteraction();
    }
  });

  updateHUD();
})();
</script>
</body>
</html>
