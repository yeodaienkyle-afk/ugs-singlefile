<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Sky</title>
  <script>
  alert("Night sky brought to by powerenkyle2");
    <script>
<style>
  :root {
    --accent: #bcd4f0;
    --text: #f4f7f8;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    background: radial-gradient(ellipse at 70% 15%, #14213d 0%, #0b1226 35%, #05060f 75%, #020208 100%);
  }

  .sky {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  /* Milky Way haze */
  .haze {
    position: absolute;
    top: -10%;
    left: -20%;
    width: 140%;
    height: 70%;
    background: linear-gradient(115deg, transparent 30%, rgba(160, 180, 220, 0.05) 45%, rgba(190, 200, 230, 0.09) 50%, rgba(160, 180, 220, 0.05) 55%, transparent 70%);
    transform: rotate(-8deg);
    filter: blur(4px);
  }

  .clouds {
    position: absolute;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
  }

  .cloud {
    position: absolute;
    filter: blur(1px);
    opacity: 0.5;
  }

  .cloud::before,
  .cloud::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(210, 218, 235, 0.9), rgba(210, 218, 235, 0));
  }

  .cloud-layer-1 {
    top: 8%;
    width: 280px;
    height: 60px;
    opacity: 0.35;
    animation: drift 70s linear infinite;
  }

  .cloud-layer-1::before { width: 160px; height: 60px; top: 0; left: 20px; }
  .cloud-layer-1::after  { width: 220px; height: 80px; top: -15px; left: 90px; }

  .cloud-layer-2 {
    top: 26%;
    width: 340px;
    height: 70px;
    opacity: 0.28;
    animation: drift 95s linear infinite;
  }

  .cloud-layer-2::before { width: 190px; height: 70px; top: 0; left: 0; }
  .cloud-layer-2::after  { width: 260px; height: 90px; top: -20px; left: 110px; }

  .cloud-layer-3 {
    top: 44%;
    width: 240px;
    height: 50px;
    opacity: 0.2;
    animation: drift 55s linear infinite;
  }

  .cloud-layer-3::before { width: 130px; height: 50px; top: 0; left: 10px; }
  .cloud-layer-3::after  { width: 180px; height: 65px; top: -12px; left: 80px; }

  @keyframes drift {
    from { transform: translateX(-30vw); }
    to   { transform: translateX(130vw); }
  }

  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle ease-in-out infinite;
  }

  .moon {
    position: absolute;
    top: 7%;
    right: 13%;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 62% 40%, rgba(180,180,170,0.5) 0%, transparent 9%),
      radial-gradient(circle at 40% 65%, rgba(170,170,160,0.45) 0%, transparent 7%),
      radial-gradient(circle at 55% 55%, rgba(190,190,180,0.35) 0%, transparent 12%),
      radial-gradient(circle at 30% 30%, rgba(200,200,190,0.3) 0%, transparent 8%),
      radial-gradient(circle at 38% 42%, #fdfaf0, #e9e4d2 55%, #cfc9b6 100%);
    box-shadow:
      0 0 40px 8px rgba(240, 238, 220, 0.5),
      0 0 90px 40px rgba(240, 238, 220, 0.18),
      0 0 160px 90px rgba(200, 210, 230, 0.06);
  }

  .mountains {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50%;
    z-index: 1;
  }

  .mountains svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .mist {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 18%;
    background: linear-gradient(to top, rgba(180, 195, 220, 0.18), transparent);
    z-index: 2;
    filter: blur(2px);
  }

  .cabin {
    position: absolute;
    bottom: 6%;
    left: 12%;
    z-index: 3;
    width: 160px;
    height: 144px;
  }

  .cabin svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(3px 4px 4px rgba(0,0,0,0.5));
  }

  .window-glow {
    position: absolute;
    top: 10%;
    left: -20%;
    width: 320px;
    height: 140px;
    background: radial-gradient(ellipse at 45% 55%, rgba(240, 200, 120, 0.2), transparent 65%);
    pointer-events: none;
  }

  .smoke {
    position: absolute;
    top: -3%;
    left: 68%;
    width: 14px;
    height: 14px;
  }

  .smoke span {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 12px;
    height: 9px;
    background: rgba(205, 210, 222, 0.5);
    filter: blur(2px);
    animation: rise 8s ease-in infinite;
  }

  .smoke span:nth-child(1) { border-radius: 60% 40% 55% 45% / 55% 60% 40% 50%; animation-delay: 0s;   }
  .smoke span:nth-child(2) { border-radius: 45% 55% 40% 60% / 60% 45% 55% 40%; animation-delay: 2s;   }
  .smoke span:nth-child(3) { border-radius: 55% 45% 60% 40% / 40% 55% 45% 60%; animation-delay: 4s;   }
  .smoke span:nth-child(4) { border-radius: 40% 60% 45% 55% / 50% 40% 60% 45%; animation-delay: 6s;   }

  @keyframes rise {
    0% {
      transform: translate(0, 0) scale(0.5) rotate(0deg);
      opacity: 0;
      border-radius: 60% 40% 55% 45% / 55% 60% 40% 50%;
    }
    12% {
      opacity: 0.5;
    }
    40% {
      transform: translate(8px, -35px) scale(1.3) rotate(15deg);
      opacity: 0.4;
      border-radius: 45% 55% 40% 60% / 60% 45% 55% 40%;
    }
    70% {
      transform: translate(-6px, -70px) scale(2) rotate(-10deg);
      opacity: 0.22;
      border-radius: 55% 45% 60% 40% / 40% 55% 45% 60%;
    }
    100% {
      transform: translate(14px, -110px) scale(2.8) rotate(20deg);
      opacity: 0;
    }
  }

  @keyframes twinkle {
    0%, 100% { opacity: var(--min-op, 0.25); }
    50% { opacity: var(--max-op, 1); }
  }

  .container {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 3rem 4rem;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    backdrop-filter: blur(6px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    animation: fadeIn 1.2s ease-out;
  }

  h1 {
    font-size: 3.5rem;
    letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), #ffffff, var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(188, 212, 240, 0.3);
  }

  p {
    margin-top: 1rem;
    font-size: 1.1rem;
    color: rgba(244, 247, 248, 0.75);
    font-style: italic;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>
<body>
  <div class="sky" id="sky">
    <div class="haze"></div>
    <div class="clouds">
      <div class="cloud cloud-layer-1" style="left: -30%;"></div>
      <div class="cloud cloud-layer-1" style="left: 60%;"></div>
      <div class="cloud cloud-layer-2" style="left: -10%;"></div>
      <div class="cloud cloud-layer-2" style="left: 80%;"></div>
      <div class="cloud cloud-layer-3" style="left: -50%;"></div>
      <div class="cloud cloud-layer-3" style="left: 40%;"></div>
    </div>
    <div class="moon"></div>
    <div class="mountains">
      <svg viewBox="0 0 1000 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="farMtn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2b3a5c"/>
            <stop offset="100%" stop-color="#1c2740"/>
          </linearGradient>
          <linearGradient id="midMtn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#19203a"/>
            <stop offset="100%" stop-color="#0f1526"/>
          </linearGradient>
          <linearGradient id="nearMtn" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0a0e1c"/>
            <stop offset="100%" stop-color="#04060d"/>
          </linearGradient>
        </defs>

        <!-- far ridge with snow caps -->
        <polygon points="0,400 0,230 60,190 120,235 190,160 230,190 280,140 260,200 340,175 400,120 430,170 480,150 520,195 580,130 610,175 670,150 700,205 760,165 810,220 860,180 920,230 970,190 1000,220 1000,400"
                 fill="url(#farMtn)" opacity="0.9"/>
        <polygon points="190,160 230,190 210,192 195,175" fill="#dfe6f2" opacity="0.55"/>
        <polygon points="400,120 430,170 405,172 398,145" fill="#dfe6f2" opacity="0.6"/>
        <polygon points="580,130 610,175 588,178 578,150" fill="#dfe6f2" opacity="0.55"/>

        <!-- mid ridge -->
        <polygon points="0,400 0,280 90,220 170,270 260,200 330,260 410,210 470,265 560,195 640,255 720,215 800,270 880,230 950,265 1000,240 1000,400"
                 fill="url(#midMtn)"/>

        <!-- near silhouette ridge -->
        <polygon points="0,400 0,320 100,270 210,330 300,255 400,325 500,270 610,335 720,275 830,330 930,285 1000,310 1000,400"
                 fill="url(#nearMtn)"/>
      </svg>
    </div>
    <div class="mist"></div>
    <div class="cabin">
      <div class="window-glow"></div>
      <svg viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cabinWall" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0a0e1c"/>
            <stop offset="55%" stop-color="#0a0e1c"/>
            <stop offset="100%" stop-color="#161f36"/>
          </linearGradient>
          <linearGradient id="cabinRoof" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#0d1120"/>
            <stop offset="100%" stop-color="#050710"/>
          </linearGradient>
        </defs>

        <!-- chimney (drawn first, its base tucks under the roof so there's no seam) -->
        <rect x="132" y="6" width="22" height="55" fill="url(#cabinRoof)"/>
        <rect x="129" y="2" width="28" height="8" fill="#04060d"/>

        <!-- roof -->
        <polygon points="100,14 14,84 186,84" fill="url(#cabinRoof)"/>

        <!-- body (top edge shares the exact same y as the roof's base, so it's seamless) -->
        <rect x="34" y="84" width="132" height="86" fill="url(#cabinWall)"/>

        <!-- window -->
        <rect x="56" y="112" width="26" height="26" fill="#ffdd99"/>
        <rect x="56" y="112" width="26" height="26" fill="none" stroke="#4a3418" stroke-width="3"/>
      </svg>
      <div class="smoke">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </div>

  <div class="container">
    <h1>free tutoring</h1>
    <p>all of the games are brought to by powerenkyle2</p>
    <p>also by mr tan who never contributed</p>
    <p> visit our</p>
     <h2 style="color: cyan; text-align: center; margin-bottom: 30px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); font-weight: normal; font-size: 18px;">
    <a href="sites.google.com/view/mr-tan-free-tutoring" 
        target="_blank" 
        style="display: inline; color: #79aadb; text-decoration: none; font-size: 18px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2);">
        main site
  </div>

  <script>
    // Generate a realistic star field entirely client-side — no external requests.
    (function () {
      var sky = document.getElementById('sky');
      var count = 220;
      for (var i = 0; i < count; i++) {
        var star = document.createElement('div');
        star.className = 'star';
        var size = Math.random() * 1.8 + 0.5;
        var top = Math.random() * 65; // keep stars mostly in upper sky
        var left = Math.random() * 100;
        var duration = (Math.random() * 3 + 2).toFixed(2);
        var delay = (Math.random() * 5).toFixed(2);
        var minOp = (Math.random() * 0.3 + 0.1).toFixed(2);
        var maxOp = (Math.random() * 0.4 + 0.6).toFixed(2);

        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.top = top + '%';
        star.style.left = left + '%';
        star.style.setProperty('--min-op', minOp);
        star.style.setProperty('--max-op', maxOp);
        star.style.animationDuration = duration + 's';
        star.style.animationDelay = delay + 's';

        if (size > 1.6) {
          star.style.boxShadow = '0 0 ' + (size * 2) + 'px rgba(255,255,255,0.6)';
        }

        sky.appendChild(star);
      }
    })();
  </script>
</body>
</html>
