<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipe Mania</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0b132b;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .game-card {
      background-color: #1c2541;
      border: 1px solid #3a506b;
      border-radius: 20px;
      padding: 24px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
      gap: 12px;
    }
    .badge {
      background: #0b132b;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #94a3b8;
      border: 1px solid #3a506b;
    }
    .badge span {
      color: #38bdf8;
    }
    .game-layout {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 8px 0;
      width: 100%;
      max-width: 440px;
    }
    .side-col {
      display: flex;
      flex-direction: column;
      height: 360px;
      justify-content: space-around;
      width: 38px;
    }
    .indicator-slot {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .inlet-tag, .outlet-tag {
      font-weight: 800;
      font-size: 0.75rem;
      padding: 4px 6px;
      border-radius: 6px;
      text-align: center;
      white-space: nowrap;
    }
    .inlet-tag {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.8);
    }
    .outlet-tag {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.8);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      flex: 1;
      aspect-ratio: 1;
      background: #0b132b;
      padding: 6px;
      border-radius: 14px;
      border: 2px solid #3a506b;
    }
    .tile-btn {
      background: #1c2541;
      border: 1px solid #3a506b;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
      transition: transform 0.1s ease, border-color 0.15s ease;
      position: relative;
    }
    .tile-btn:hover {
      border-color: #38bdf8;
    }
    .tile-btn:active {
      transform: scale(0.95);
    }
    .tile-btn.filled {
      border-color: #38bdf8;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }
    .tile-btn.spilled {
      border-color: #ef4444;
      background: #450a0a;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
    }
    svg.pipe-svg {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .status {
      min-height: 28px;
      margin-top: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: #34d399;
      text-align: center;
    }
    .status.lose {
      color: #f87171;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      width: 100%;
    }
    .btn {
      flex: 1;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-align: center;
    }
    .btn:hover { background-color: #0369a1; }
    .btn-flow {
      background-color: #10b981;
    }
    .btn-flow:hover {
      background-color: #059669;
    }
    .btn-secondary { background-color: #3a506b; }
    .btn-secondary:hover { background-color: #4b6584; }
    .instructions {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>Pipe Mania</h1>

    <div class="top-bar">
      <div class="badge">Timer: <span id="timerCount">15s</span></div>
      <div class="badge">Length: <span id="lengthCount">0</span></div>
      <div class="badge">Score: <span id="scoreCount">0</span></div>
    </div>

    <div class="game-layout">
      <div class="side-col" id="leftCol"></div>
      <div class="grid" id="grid"></div>
      <div class="side-col" id="rightCol"></div>
    </div>

    <div class="status" id="statusMsg"></div>

    <div class="btn-group">
      <button class="btn btn-secondary" id="restartBtn">Reset Tiles</button>
      <button class="btn btn-flow" id="flowBtn">FLOW NOW!</button>
      <button class="btn" id="newGameBtn">New Game</button>
    </div>

    <p class="instructions">Click pipe tiles to rotate them into a continuous line from the left inlet to the right outlet, then press FLOW!</p>
  </div>

  <script>
    const GRID_SIZE = 7;
    // Directions: 0: Top, 1: Right, 2: Bottom, 3: Left
    const OPPOSITE = [2, 3, 0, 1];
    const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];

    let grid = [];
    let initialGrid = [];
    let startR = 3;
    let endR = 3;
    let timerVal = 15;
    let timerInterval = null;
    let flowInterval = null;
    let isFlowing = false;
    let isGameOver = false;
    let score = 0;
    let pipeLength = 0;

    const gridEl = document.getElementById('grid');
    const leftColEl = document.getElementById('leftCol');
    const rightColEl = document.getElementById('rightCol');
    const timerCountEl = document.getElementById('timerCount');
    const lengthCountEl = document.getElementById('lengthCount');
    const scoreCountEl = document.getElementById('scoreCount');
    const statusMsgEl = document.getElementById('statusMsg');

    function getOpenings(type, rot) {
      rot = (rot % 4 + 4) % 4;
      if (type === 'straight') {
        return rot % 2 === 0 ? [0, 2] : [1, 3];
      } else if (type === 'elbow') {
        return [rot, (rot + 1) % 4];
      } else if (type === 'tee') {
        return [rot, (rot + 1) % 4, (rot + 3) % 4];
      } else if (type === 'cross') {
        return [0, 1, 2, 3];
      }
      return [];
    }

    function selectTileForDirs(d1, d2) {
      const sorted = [d1, d2].sort((a,b) => a - b);
      if (sorted[0] === 0 && sorted[1] === 2) return { type: 'straight', rot: 0 };
      if (sorted[0] === 1 && sorted[1] === 3) return { type: 'straight', rot: 1 };

      if (sorted[0] === 0 && sorted[1] === 1) return { type: 'elbow', rot: 0 };
      if (sorted[0] === 1 && sorted[1] === 2) return { type: 'elbow', rot: 1 };
      if (sorted[0] === 2 && sorted[1] === 3) return { type: 'elbow', rot: 2 };
      if (sorted[0] === 0 && sorted[1] === 3) return { type: 'elbow', rot: 3 };

      return { type: 'cross', rot: 0 };
    }

    function renderIndicators() {
      leftColEl.innerHTML = '';
      rightColEl.innerHTML = '';

      for (let r = 0; r < GRID_SIZE; r++) {
        const leftSlot = document.createElement('div');
        leftSlot.className = 'indicator-slot';
        if (r === startR) {
          leftSlot.innerHTML = '<div class="inlet-tag">IN ▶</div>';
        }
        leftColEl.appendChild(leftSlot);

        const rightSlot = document.createElement('div');
        rightSlot.className = 'indicator-slot';
        if (r === endR) {
          rightSlot.innerHTML = '<div class="outlet-tag">▶ OUT</div>';
        }
        rightColEl.appendChild(rightSlot);
      }
    }

    function generateSolvableLevel() {
      stopIntervals();
      isFlowing = false;
      isGameOver = false;
      score = 0;
      pipeLength = 0;
      timerVal = 15;

      statusMsgEl.textContent = '';
      statusMsgEl.className = 'status';

      // Pick random start and end rows
      startR = Math.floor(Math.random() * 5) + 1; // 1 to 5
      endR = Math.floor(Math.random() * 5) + 1;

      renderIndicators();

      // Generate path
      let currR = startR;
      let currC = 0;
      const path = [{ r: currR, c: currC }];
      const visited = new Set();
      visited.add(`${currR},${currC}`);

      while (currC < GRID_SIZE - 1) {
        const candidates = [];
        candidates.push([currR, currC + 1]); // Right
        if (currR > 0 && !visited.has(`${currR - 1},${currC}`)) candidates.push([currR - 1, currC]); // Up
        if (currR < GRID_SIZE - 1 && !visited.has(`${currR + 1},${currC}`)) candidates.push([currR + 1, currC]); // Down

        const chosen = candidates[Math.floor(Math.random() * candidates.length)];
        currR = chosen[0];
        currC = chosen[1];
        visited.add(`${currR},${currC}`);
        path.push({ r: currR, c: currC });
      }

      // Initialize grid
      grid = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));

      const pathMap = new Map();
      path.forEach((p, idx) => {
        let entryDir = 3; // Left for start
        let exitDir = 1;  // Right for end

        if (idx > 0) {
          const prev = path[idx - 1];
          if (prev.r < p.r) entryDir = 0; // Top
          else if (prev.r > p.r) entryDir = 2; // Bottom
          else if (prev.c < p.c) entryDir = 3; // Left
          else entryDir = 1; // Right
        }

        if (idx < path.length - 1) {
          const next = path[idx + 1];
          if (next.r < p.r) exitDir = 0;
          else if (next.r > p.r) exitDir = 2;
          else if (next.c < p.c) exitDir = 3;
          else exitDir = 1;
        }

        const tileDef = selectTileForDirs(entryDir, exitDir);
        pathMap.set(`${p.r},${p.c}`, tileDef);
      });

      const types = ['straight', 'elbow', 'tee', 'cross'];

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const key = `${r},${c}`;
          let tileInfo;
          if (pathMap.has(key)) {
            tileInfo = { ...pathMap.get(key) };
          } else {
            const t = types[Math.floor(Math.random() * types.length)];
            const rot = Math.floor(Math.random() * 4);
            tileInfo = { type: t, rot };
          }

          // Scramble rotation by 1 to 3 turns
          const scramble = Math.floor(Math.random() * 3) + 1;
          const currentRot = (tileInfo.rot + scramble) % 4;

          grid[r][c] = {
            type: tileInfo.type,
            correctRot: tileInfo.rot,
            rot: currentRot,
            filled: false,
            spilled: false
          };
        }
      }

      initialGrid = grid.map(row => row.map(cell => ({ ...cell })));

      updateStats();
      renderGrid();
      startCountdown();
    }

    function resetGrid() {
      stopIntervals();
      isFlowing = false;
      isGameOver = false;
      score = 0;
      pipeLength = 0;
      timerVal = 15;

      statusMsgEl.textContent = '';
      statusMsgEl.className = 'status';

      grid = initialGrid.map(row => row.map(cell => ({ ...cell, filled: false, spilled: false })));

      updateStats();
      renderGrid();
      startCountdown();
    }

    function stopIntervals() {
      if (timerInterval) clearInterval(timerInterval);
      if (flowInterval) clearInterval(flowInterval);
      timerInterval = null;
      flowInterval = null;
    }

    function startCountdown() {
      timerCountEl.textContent = `${timerVal}s`;
      timerInterval = setInterval(() => {
        timerVal--;
        timerCountEl.textContent = `${timerVal}s`;
        if (timerVal <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          startFlow();
        }
      }, 1000);
    }

    function handleTileClick(r, c) {
      if (isFlowing || isGameOver) return;
      grid[r][c].rot = (grid[r][c].rot + 1) % 4;
      renderGrid();
    }

    function startFlow() {
      if (isFlowing || isGameOver) return;
      stopIntervals();
      isFlowing = true;
      timerCountEl.textContent = 'FLOWING';

      let currR = startR;
      let currC = 0;
      let entryDir = 3; // Entered from Left

      flowInterval = setInterval(() => {
        if (currR < 0 || currR >= GRID_SIZE || currC < 0 || currC >= GRID_SIZE) {
          stopIntervals();
          isGameOver = true;
          statusMsgEl.textContent = '💥 Water spilled out of the grid!';
          statusMsgEl.className = 'status lose';
          return;
        }

        const cell = grid[currR][currC];
        const openings = getOpenings(cell.type, cell.rot);

        if (!openings.includes(entryDir)) {
          cell.spilled = true;
          renderGrid();
          stopIntervals();
          isGameOver = true;
          statusMsgEl.textContent = '💥 Water spilled! Blocked pipe.';
          statusMsgEl.className = 'status lose';
          return;
        }

        cell.filled = true;
        pipeLength++;
        score += 100;
        updateStats();
        renderGrid();

        const exitDirs = openings.filter(d => d !== entryDir);
        const exitDir = exitDirs[0] !== undefined ? exitDirs[0] : entryDir;

        if (currC === GRID_SIZE - 1 && currR === endR && exitDir === 1) {
          stopIntervals();
          isGameOver = true;
          score += timerVal * 50 + 500;
          updateStats();
          statusMsgEl.textContent = `🎉 WIN! Completed path length ${pipeLength}! Score: ${score}`;
          return;
        }

        const [dr, dc] = DIRS[exitDir];
        currR += dr;
        currC += dc;
        entryDir = OPPOSITE[exitDir];

      }, 250);
    }

    function updateStats() {
      lengthCountEl.textContent = pipeLength;
      scoreCountEl.textContent = score;
    }

    function drawPipeSvg(type, rot, filled, spilled) {
      const strokeColor = spilled ? '#ef4444' : (filled ? '#38bdf8' : '#64748b');
      const innerColor = spilled ? '#f87171' : (filled ? '#0284c7' : '#334155');

      const openings = getOpenings(type, rot);
      let paths = '';

      openings.forEach(d => {
        if (d === 0) paths += '<line x1="25" y1="25" x2="25" y2="0" stroke="' + strokeColor + '" stroke-width="12" stroke-linecap="round"/>';
        if (d === 1) paths += '<line x1="25" y1="25" x2="50" y2="25" stroke="' + strokeColor + '" stroke-width="12" stroke-linecap="round"/>';
        if (d === 2) paths += '<line x1="25" y1="25" x2="25" y2="50" stroke="' + strokeColor + '" stroke-width="12" stroke-linecap="round"/>';
        if (d === 3) paths += '<line x1="25" y1="25" x2="0" y2="25" stroke="' + strokeColor + '" stroke-width="12" stroke-linecap="round"/>';
      });

      return `<svg class="pipe-svg" viewBox="0 0 50 50">
        <circle cx="25" cy="25" r="8" fill="${innerColor}" />
        ${paths}
      </svg>`;
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = grid[r][c];
          const btn = document.createElement('button');
          btn.className = `tile-btn ${cell.filled ? 'filled' : ''} ${cell.spilled ? 'spilled' : ''}`;
          btn.innerHTML = drawPipeSvg(cell.type, cell.rot, cell.filled, cell.spilled);
          btn.addEventListener('click', () => handleTileClick(r, c));
          gridEl.appendChild(btn);
        }
      }
    }

    document.getElementById('flowBtn').addEventListener('click', startFlow);
    document.getElementById('newGameBtn').addEventListener('click', generateSolvableLevel);
    document.getElementById('restartBtn').addEventListener('click', resetGrid);

    // Initial load
    generateSolvableLevel();
  </script>
</body>
</html>
