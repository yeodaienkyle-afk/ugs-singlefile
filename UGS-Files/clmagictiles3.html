<script>
/* UGS_OFFLINE layer: cache everything from our pinned CDN into browser Cache Storage.
   First (online) load fills the cache; after that the game boots 100% local and works
   even where cdn.jsdelivr.net /gh/ is blocked (school). Play a song once online to cache it. */
(function () {
  var BASE = "https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/youtube-playables@1b8d5d149e9498d3ea95aad1037d1411511d41d3/magic-tiles-3/";
  var CNAME = "mt3-1b8d5d14";
  if (!window.caches) { console.log("[mt3-offline] no Cache Storage"); return; }

  function cachedFetch(url) {
    return caches.open(CNAME).then(function (c) {
      return c.match(url).then(function (hit) { return hit || null; });
    });
  }
  function netFetch(url) {
    return fetch(url).then(function (resp) {
      if (resp && resp.ok) {
        caches.open(CNAME).then(function (c) { try { c.put(url, resp.clone()); } catch (e) {} });
      }
      return resp;
    });
  }

  var nativeFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    var url = "";
    try { url = new URL(typeof input === "string" ? input : (input && input.url) || String(input), document.baseURI).href; } catch (e) {}
    var isGet = !init || !init.method || String(init.method).toUpperCase() === "GET";
    if (!isGet || url.indexOf(BASE) !== 0) return nativeFetch(input, init);
    return cachedFetch(url).then(function (hit) {
      if (hit) return hit;
      return netFetch(input);
    }).catch(function () { return nativeFetch(input, init); });
  };

  var NativeXHR = window.XMLHttpRequest;
  window.XMLHttpRequest = function (opts) {
    var xhr = new NativeXHR(opts);
    var origOpen = xhr.open.bind(xhr);
    var origSend = xhr.send.bind(xhr);
    var url = "";
    xhr.open = function (m, u) {
      url = "";
      try { url = new URL(u, document.baseURI).href; } catch (e) {}
      return origOpen.apply(xhr, arguments);
    };
    xhr.send = function () {
      var self = this;
      if (!url || url.indexOf(BASE) !== 0) return origSend.apply(self, arguments);
      cachedFetch(url).then(function (hit) {
        if (hit) return hit.arrayBuffer().then(function (buf) {
          function txt() { return new TextDecoder("utf-8").decode(buf); }
          function resp() {
            var rt = self.responseType;
            if (rt === "arraybuffer") return buf;
            if (rt === "blob") return new Blob([buf]);
            if (rt === "json") return JSON.parse(txt());
            return txt();
          }
          Object.defineProperty(self, "status", { value: 200, configurable: true });
          Object.defineProperty(self, "statusText", { value: "OK", configurable: true });
          Object.defineProperty(self, "responseURL", { value: url, configurable: true });
          Object.defineProperty(self, "response", { get: resp, configurable: true });
          Object.defineProperty(self, "responseText", { get: txt, configurable: true });
          Object.defineProperty(self, "readyState", { value: 4, configurable: true });
          setTimeout(function () {
            if (self.onreadystatechange) self.onreadystatechange();
            if (self.onload) self.onload({ type: "load", target: self });
            self.dispatchEvent(new Event("readystatechange"));
            self.dispatchEvent(new Event("load"));
            self.dispatchEvent(new ProgressEvent("loadend"));
          }, 1);
        });
        self.addEventListener("load", function () {
          if (self.status === 200) {
            caches.open(CNAME).then(function (c) { try { c.put(url, new Response(self.response)); } catch (e) {} });
          }
        });
        return origSend.apply(self, arguments);
      }).catch(function () { origSend.apply(self, arguments); });
    };
    return xhr;
  };

  /* element src redirection: script/img/audio tags pointing into our CDN get served
     from Cache Storage via blob: URLs (script src tags cannot be intercepted otherwise) */
  function patchSrc(protoName, tryNetFetch) {
    var proto = window[protoName] && window[protoName].prototype;
    if (!proto) return;
    var desc = Object.getOwnPropertyDescriptor(proto, "src");
    if (!desc || !desc.set) return;
    var nativeSet = desc.set, nativeGet = desc.get;
    Object.defineProperty(proto, "src", {
      get: function () { return this.__ugRealSrc || nativeGet.call(this); },
      set: function (v) {
        var self = this, url = "";
        try { url = new URL(v, document.baseURI).href; } catch (e) {}
        if (String(v).indexOf("blob:") === 0 || String(v).indexOf("data:") === 0 || url.indexOf(BASE) !== 0) return nativeSet.call(self, v);
        self.__ugRealSrc = url;
        cachedFetch(url).then(function (hit) {
          if (hit) return hit.blob();
          if (!tryNetFetch) throw new Error("not cached");
          return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); });
        }).then(function (blob) {
          nativeSet.call(self, URL.createObjectURL(blob));
        }).catch(function () { nativeSet.call(self, v); });
      },
      configurable: true
    });
  }
  patchSrc("HTMLScriptElement", true);
  patchSrc("HTMLImageElement", true);
  patchSrc("HTMLMediaElement", true);

  var nativeSetAttr = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (n, v) {
    var tag = (this.tagName || "").toLowerCase();
    if ((n === "src") && typeof v === "string" && (tag === "img" || tag === "audio" || tag === "source" || tag === "script")) {
      try { this.src = v; return; } catch (e) {}
    }
    return nativeSetAttr.call(this, n, v);
  };

  /* boot through the cache layer: settings -> main -> cocos2d -> physics -> window.boot() */
  window.__ugBootChain = function () {
    function js(u) {
      return fetch(u).then(function (r) {
        if (!r.ok) throw new Error(u + " " + r.status);
        return r.text();
      }).then(function (t) {
        var s = document.createElement("script"); s.textContent = t;
        document.head.appendChild(s);
      });
    }
    var done = js("src/settings.js")
      .then(function () { return js("main.js"); })
      .then(function () { return js("cocos2d-js-min.js"); })
      .then(function () { return js("physics-min.js"); });
    done.then(function () {
      var iv = setInterval(function () {
        if (window.boot) { clearInterval(iv); window.boot(); }
      }, 50);
    }).catch(function (e) {
      console.log("[mt3-offline] boot failed:", e);
    });
  };
})();
</script>

<script>
/* FORCE TOUCH MODE: this build locks keyboard ("laptop") mode on when the
   engine sees a desktop, because cc.sys.isMobile drives every gameplay branch.
   1) Spoof a mobile UA + touch capabilities BEFORE the Cocos engine loads,
      so the game genuinely runs its touch gameplay (tap + working holds).
   2) Bridge mouse input to synthetic touch events, because the engine skips
      its mouse listeners in mobile mode (dead input on desktops otherwise). */
(function () {
  try {
    Object.defineProperty(navigator, 'userAgent', {
      get: function () {
        return 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36';
      }, configurable: true
    });
  } catch (e) {}
  try {
    Object.defineProperty(navigator, 'maxTouchPoints', { get: function () { return 5; }, configurable: true });
  } catch (e) {}
  /* engine computes capabilities.touches from 'ontouchstart' in window/document */
  try { window.ontouchstart = null; document.ontouchstart = null; } catch (e) {}

  var mx = 0, my = 0, held = false, lastRealTouch = 0;
  document.addEventListener('touchstart', function (e) { if (e.isTrusted) lastRealTouch = Date.now(); }, true);

  function canvas() {
    return (window.cc && cc.game && cc.game.canvas) || document.getElementById('GameCanvas');
  }
  function fire(type) {
    var cv = canvas();
    if (!cv) return;
    var r = cv.getBoundingClientRect();
    var t;
    try {
      t = new Touch({
        identifier: 901, target: cv,
        clientX: mx, clientY: my,
        pageX: mx, pageY: my,
        screenX: mx + r.left, screenY: my + r.top,
        radiusX: 4, radiusY: 4, rotationAngle: 0, force: 1
      });
    } catch (e) { return; }
    var ev;
    try {
      ev = new TouchEvent(type, {
        bubbles: true, cancelable: true,
        touches: type === 'touchend' ? [] : [t],
        targetTouches: type === 'touchend' ? [] : [t],
        changedTouches: [t]
      });
    } catch (e) { return; }
    cv.dispatchEvent(ev);
  }
  function isRealTouch() { return Date.now() - lastRealTouch < 800; }

  document.addEventListener('mousedown', function (e) {
    mx = e.clientX; my = e.clientY;
    if (isRealTouch()) return;
    held = true;
    fire('touchstart');
  }, true);
  document.addEventListener('mousemove', function (e) {
    mx = e.clientX; my = e.clientY;
    if (held && !isRealTouch()) fire('touchmove');
  }, true);
  document.addEventListener('mouseup', function (e) {
    mx = e.clientX; my = e.clientY;
    if (held && !isRealTouch()) fire('touchend');
    held = false;
  }, true);
  window.addEventListener('blur', function () {
    if (held) { fire('touchcancel'); held = false; }
  });
})();
</script>
