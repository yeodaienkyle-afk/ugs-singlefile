<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png" />
  <link rel="canonical" href="https://docs.google.com/" />
  <base href="https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@2505fd1f3eb939bc031d0156d0874059741d9ffc/UGS-Files/mt3/">
  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="msapplication-tap-highlight" content="no">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preload" href="src/settings.js" as="script">
  <link rel="preload" href="main.js" as="script">
  <link rel="preload" href="cocos2d-js-min.js" as="script">
  <link rel="preload" href="style-mobile.css" as="style">
  <link rel="preload" href="logo_expanded.jpeg" as="image">
  <link rel="stylesheet" type="text/css" href="style-mobile.css" />
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    #splash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #FFFFFF; display: flex; align-items: center; justify-content: center; z-index: 999; }
    #splash-logo { width: 100vmin; height: 100vmin; object-fit: contain; opacity: 0; transition: opacity 0.5s ease-in-out; }
    #GameCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  </style>
</head>

<body>
  <div id="splash"><img id="splash-logo" src="logo_expanded.jpeg" alt="Amanotes Logo"></div>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <script src="src/settings.js" charset="utf-8"></script>
  <script src="main.js" charset="utf-8"></script>
  <script type="text/javascript">
    (function () {
      var debug = window._CCSettings.debug;
      var splash = document.getElementById('splash');
      splash.style.display = 'block';
      function loadScript(moduleName, cb) {
        function scriptLoaded() { document.body.removeChild(domScript); domScript.removeEventListener('load', scriptLoaded, false); cb && cb(); };
        var domScript = document.createElement('script');
        domScript.async = true;
        domScript.src = moduleName;
        domScript.addEventListener('load', scriptLoaded, false);
        document.body.appendChild(domScript);
      }
      loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.js', function () {
        if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) { loadScript(debug ? 'physics.js' : 'physics-min.js', window.boot); }
        else { window.boot(); }
      });
    })();
  </script>
</body>

</html>
