<!DOCTYPE html><html><head><meta charset="utf-8"><title>Home</title>
<style>body{background:#111;color:#0f0;font:12px monospace;margin:0;padding:8px;white-space:pre-wrap}#log{}</style>
</head><body>
<div id="log"></div>
<script>
window.__log=[];
function L(m){window.__log.push(String(m));document.getElementById('log').textContent=window.__log.join('\n');}
window.addEventListener('error',function(e){L('WIN ERROR: '+(e.message||e.type)+' | '+(e.target&&e.target.src?('src='+e.target.src):''));},true);
L('start');
</script>
<script src="https://cdn.jsdelivr.net/npm/js-dos@8.5.4/dist/js-dos.js" onload="L('script onload')" onerror="L('script onerror')"></script>
<script>
L('after script tag, Dos=' + typeof window.Dos);
setTimeout(function(){
  L('t+3s Dos=' + typeof window.Dos + ' | WebRTCNet=' + typeof window.WebRTCNet);
}, 3000);
</script>
</body></html>
