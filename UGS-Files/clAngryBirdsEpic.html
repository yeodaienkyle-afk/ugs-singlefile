<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/EpicWeb@f5c586ceaa51bef9928421557d4ab842a770153f/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Epicweb</title>
    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
   <div
  id="loading-text"
  style="
    color: white;
    font-size: 48px;
    font-family: cursive;
    text-align: center;
    margin-top: 20px;
    background-color: rgba(0, 0, 0, 0.8);
    padding: 20px;
    border-radius: 10px;
    position: relative;
    z-index: 1000;
    width: 90%;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
  "
>
  LOADING...
</div>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>

      <script>
      
      const loadingText = document.querySelector("#loading-text");
      let totalBytes = 174160000.0;
      let loadedBytes = 0;

      function formatSize(bytes) {
        if (bytes > 1024 * 1024 * 1024) {
          return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
        } else if (bytes > 1024 * 1024) {
          return (bytes / (1024 * 1024)).toFixed(2) + " MB";
        } else if (bytes > 1024) {
          return (bytes / 1024).toFixed(2) + " KB";
        } else {
          return bytes + " B";
        }
      }
      async function fetchWithProgress(url) {
        const response = await fetch(url);
        const reader = response.body.getReader();
        let chunks = [];
        let received = 0;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          received += value.length;
          loadedBytes += value.length;
          chunks.push(value);
          const doneText = formatSize(loadedBytes);
          const totalText = formatSize(totalBytes);
          const percent =
            totalBytes > 0
              ? ((loadedBytes / totalBytes) * 100).toFixed(1)
              : "?";
          loadingText.textContent = `LOADING... ${doneText} / ${totalText} (${percent}%)`;
        }
        let fullBuffer = new Uint8Array(received);
        let offset = 0;
        for (let chunk of chunks) {
          fullBuffer.set(chunk, offset);
          offset += chunk.length;
        }
        return fullBuffer.buffer;
      }
      async function mergeFiles(parts) {
        const buffers = await Promise.all(parts.map(fetchWithProgress));
        return URL.createObjectURL(new Blob(buffers));
      }

      function getParts(file, count) {
        let parts = [];
        for (let i = 1; i <= count; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }
      (async () => {
        const dataParts = getParts("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/EpicWeb@f5c586ceaa51bef9928421557d4ab842a770153f/Build/EpicWeb.data", 7);
        const wasmParts = getParts("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/EpicWeb@f5c586ceaa51bef9928421557d4ab842a770153f/Build/EpicWeb.wasm", 2);
        const allParts = [...dataParts, ...wasmParts];
        const [dataUrl, wasmUrl] = await Promise.all([
          mergeFiles(dataParts),
          mergeFiles(wasmParts),
        ]);
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector(
          "#unity-progress-bar-full"
        );
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {}

      var buildUrl = "https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/EpicWeb@f5c586ceaa51bef9928421557d4ab842a770153f/Build/";
      var loaderUrl = buildUrl + "EpicWeb.loader.js";
      var config = {
        dataUrl: dataUrl,
        frameworkUrl: buildUrl + "EpicWeb.framework.js",
        codeUrl: wasmUrl,
        streamingAssetsUrl: "https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/EpicWeb@f5c586ceaa51bef9928421557d4ab842a770153f/StreamingAssets/",
        companyName: "Rovio Entertainment Ltd.",
        productName: "Epic",
        productVersion: "3.0.1",
        showBanner: unityShowBanner,
      };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content =
            "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then((unityInstance) => {
              loadingText.remove();
              loadingBar.style.display = "none";
            })
            .catch((message) => {
              alert(message);
            });
        };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
