<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flood-It</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .game-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #ec4899;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.5px;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 16px;
    }
    .badge {
      background: #334155;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #94a3b8;
    }
    .badge span {
      color: #f8fafc;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 2px;
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1;
      margin: 8px 0;
      background: #0f172a;
      padding: 6px;
      border-radius: 12px;
      border: 2px solid #334155;
    }
    .cell {
      border-radius: 2px;
      transition: background-color 0.2s ease;
    }
    .palette {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 100%;
      margin-top: 16px;
    }
    .color-btn {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .color-btn:hover {
      transform: scale(1.08);
    }
    .color-btn:active {
      transform: scale(0.95);
    }
    .color-btn.active {
      border-color: #ffffff;
      transform: scale(1.05);
    }
    .status {
      min-height: 28px;
      margin-top: 12px;
      font-size: 1rem;
      font-weight: 700;
      color: #4ade80;
      text-align: center;
    }
    .status.lose {
      color: #f87171;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      width: 100%;
    }
    .btn {
      flex: 1;
      background-color: #ec4899;
      color: #ffffff;
      border: none;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-align: center;
    }
    .btn:hover { background-color: #db2777; }
    .btn-secondary { background-color: #334155; }
    .btn-secondary:hover { background-color: #475569; }
    .instructions {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="game-card">
    <h1>Flood-It</h1>

    <div class="stats-bar">
      <div class="badge">Moves: <span id="moveCount">0</span> / <span id="maxMoves">25</span></div>
      <div class="badge">Start Corner: <span>Bottom-Left</span></div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="palette" id="palette"></div>

    <div class="status" id="statusMsg"></div>

    <div class="btn-group">
      <button class="btn btn-secondary" id="restartBtn">Reset Board</button>
      <button class="btn" id="newGameBtn">New Game</button>
    </div>

    <p class="instructions">Click palette colors below to flood-fill from the bottom-left corner and fill the board in 25 moves or less!</p>
  </div>

  <script>
    const GRID_SIZE = 14;
    const MAX_MOVES = 25;
    const COLORS = [
      '#ef4444', // Red
      '#22c55e', // Green
      '#3b82f6', // Blue
      '#eab308', // Yellow
      '#a855f7', // Purple
      '#f97316'  // Orange
    ];

    let board = [];
    let initialBoard = [];
    let moveCount = 0;
    let isGameOver = false;

    const gridEl = document.getElementById('grid');
    const paletteEl = document.getElementById('palette');
    const moveCountEl = document.getElementById('moveCount');
    const statusMsgEl = document.getElementById('statusMsg');

    function createRandomBoard() {
      const b = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        const row = [];
        for (let c = 0; c < GRID_SIZE; c++) {
          row.push(Math.floor(Math.random() * COLORS.length));
        }
        b.push(row);
      }
      return b;
    }

    function cloneBoard(b) {
      return b.map(row => [...row]);
    }

    function initGame() {
      board = createRandomBoard();
      initialBoard = cloneBoard(board);
      moveCount = 0;
      isGameOver = false;

      statusMsgEl.textContent = '';
      statusMsgEl.className = 'status';

      updateStats();
      renderPalette();
      renderGrid();
    }

    function resetBoard() {
      board = cloneBoard(initialBoard);
      moveCount = 0;
      isGameOver = false;

      statusMsgEl.textContent = '';
      statusMsgEl.className = 'status';

      updateStats();
      renderPalette();
      renderGrid();
    }

    function updateStats() {
      moveCountEl.textContent = moveCount;
    }

    function floodFill(colorIndex) {
      if (isGameOver) return;

      // Starting region corner: bottom-left = (row GRID_SIZE - 1, col 0)
      const startR = GRID_SIZE - 1;
      const startC = 0;
      const targetColor = board[startR][startC];

      if (targetColor === colorIndex) return; // Same color selected

      const queue = [[startR, startC]];
      const visited = Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(false));
      visited[startR][startC] = true;

      const dirs = [[-1,0], [1,0], [0,-1], [0,1]];

      while (queue.length > 0) {
        const [r, c] = queue.shift();
        board[r][c] = colorIndex;

        for (const [dr, dc] of dirs) {
          const nr = r + dr;
          const nc = c + dc;

          if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
            if (!visited[nr][nc] && board[nr][nc] === targetColor) {
              visited[nr][nc] = true;
              queue.push([nr, nc]);
            }
          }
        }
      }

      moveCount++;
      updateStats();
      renderGrid();
      renderPalette();

      checkGameEnd();
    }

    function checkUniform() {
      const firstColor = board[0][0];
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (board[r][c] !== firstColor) return false;
        }
      }
      return true;
    }

    function checkGameEnd() {
      if (checkUniform()) {
        isGameOver = true;
        statusMsgEl.textContent = `🎉 You flooded the board in ${moveCount} moves!`;
      } else if (moveCount >= MAX_MOVES) {
        isGameOver = true;
        statusMsgEl.textContent = '❌ Out of moves! Game Over.';
        statusMsgEl.className = 'status lose';
      }
    }

    function renderGrid() {
      gridEl.innerHTML = '';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const div = document.createElement('div');
          div.className = 'cell';
          div.style.backgroundColor = COLORS[board[r][c]];
          gridEl.appendChild(div);
        }
      }
    }

    function renderPalette() {
      paletteEl.innerHTML = '';
      const currentColor = board[GRID_SIZE - 1][0]; // Bottom-left corner color

      COLORS.forEach((colorHex, idx) => {
        const btn = document.createElement('button');
        btn.className = `color-btn ${idx === currentColor ? 'active' : ''}`;
        btn.style.backgroundColor = colorHex;
        btn.setAttribute('aria-label', `Color ${idx + 1}`);
        btn.addEventListener('click', () => floodFill(idx));
        paletteEl.appendChild(btn);
      });
    }

    document.getElementById('newGameBtn').addEventListener('click', initGame);
    document.getElementById('restartBtn').addEventListener('click', resetBoard);

    // Initial game
    initGame();
  </script>
</body>
</html>
