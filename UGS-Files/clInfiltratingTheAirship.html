<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infiltrating the airship</title>
<link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#game{position:fixed;inset:0}
#ugsl{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#c9cede;font:13px system-ui,sans-serif;z-index:2;text-align:center}
</style></head>
<body>
<div id="ugsl">loading Infiltrating the airship...</div>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.7.1/ruffle.js"></script>
<script>
(function () {
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden", letterbox: "on", scale: "showAll", splashScreen: false };
  var tries = 0, started = false;
  function boot() {
    if (started) return;
    var label = document.getElementById("ugsl");
    var host = document.getElementById("game");
    if (!host) { return setTimeout(boot, 120); }
    if (!window.RufflePlayer || !window.RufflePlayer.newest) {
      if (tries++ < 150) return setTimeout(boot, 120);
      if (label) label.textContent = "player failed to load - refresh the page";
      return;
    }
    started = true;
    var player = window.RufflePlayer.newest().createPlayer();
    player.style.width = "100%";
    player.style.height = "100%";
    host.appendChild(player);
    try { player.load("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/Holy-Moly-Rips@6fb555f8b6102654fd4d62fef74db1680826f70b/Henry%20Stickman/Inflitraiting%20The%20Airship/618518_Airship.swf"); } catch (e) { if (label) label.textContent = "flash error: " + e.message; return; }
    setTimeout(function () { if (label) label.style.display = "none"; }, 2500);
  }
  boot();
})();
</script>
</body></html>
