<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battleship</title>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 900px;
      width: 100%;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #38bdf8;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    button {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #475569;
      border-color: #64748b;
    }
    button.primary {
      background-color: #2563eb;
      border-color: #3b82f6;
    }
    button.primary:hover {
      background-color: #1d4ed8;
    }
    .status {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      min-height: 1.6em;
      text-align: center;
      color: #facc15;
    }
    .boards-wrapper {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
    .board-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #94a3b8;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 2px;
      background-color: #0f172a;
      padding: 6px;
      border-radius: 8px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5);
    }
    .cell {
      width: min(8vw, 36px);
      height: min(8vw, 36px);
      background-color: #1e3a8a;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      user-select: none;
      position: relative;
      transition: background-color 0.15s ease;
    }
    .enemy-grid .cell {
      cursor: pointer;
    }
    .enemy-grid .cell:hover {
      background-color: #2563eb;
    }
    .cell.ship {
      background-color: #475569;
      border: 1px solid #64748b;
    }
    .cell.preview-valid {
      background-color: rgba(34, 197, 94, 0.7) !important;
    }
    .cell.preview-invalid {
      background-color: rgba(239, 68, 68, 0.7) !important;
    }
    .cell.hit {
      background-color: #ef4444 !important;
      color: #ffffff;
    }
    .cell.hit::after {
      content: '✕';
      font-size: 1.1rem;
      font-weight: 900;
    }
    .cell.miss {
      background-color: #334155 !important;
    }
    .cell.miss::after {
      content: '•';
      font-size: 1.4rem;
      color: #94a3b8;
    }
    .cell.sunk {
      background-color: #991b1b !important;
    }
    .how-to-play {
      margin-top: 20px;
      font-size: 0.88rem;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Battleship</h1>
    <div class="controls" id="controls">
      <button id="rotate-btn">Rotate Ship (Horizontal)</button>
      <button id="random-btn">Random Setup</button>
      <button class="primary" id="restart-btn">New Game</button>
    </div>
    <div class="status" id="status">Place your ships</div>
    <div class="boards-wrapper">
      <div class="board-panel">
        <div class="panel-title">Your Fleet</div>
        <div class="grid" id="player-grid"></div>
      </div>
      <div class="board-panel">
        <div class="panel-title">Enemy Waters</div>
        <div class="grid enemy-grid" id="enemy-grid"></div>
      </div>
    </div>
    <p class="how-to-play">Place your ships (press 'R' or Rotate button), then click Enemy Waters to strike. Sink all enemy ships to win!</p>
  </div>

  <script>
    (function() {
      const GRID_SIZE = 10;
      const SHIPS_DEF = [
        { name: 'Carrier', size: 5 },
        { name: 'Battleship', size: 4 },
        { name: 'Cruiser', size: 3 },
        { name: 'Submarine', size: 3 },
        { name: 'Destroyer', size: 2 }
      ];

      // States: 'placement', 'playing', 'gameover'
      let gameState = 'placement';
      let playerGrid = []; // 0=water, shipObj=ship reference, 'H'=hit, 'M'=miss
      let enemyGrid = [];
      let playerShips = [];
      let enemyShips = [];

      let currentShipIndex = 0;
      let isHorizontal = true;

      // AI Target hunting state
      let aiHuntTargets = []; // Array of {r, c} adjacent to hits
      let aiLastHit = null;

      const playerGridEl = document.getElementById('player-grid');
      const enemyGridEl = document.getElementById('enemy-grid');
      const statusEl = document.getElementById('status');
      const rotateBtn = document.getElementById('rotate-btn');
      const randomBtn = document.getElementById('random-btn');
      const restartBtn = document.getElementById('restart-btn');

      function createEmptyGrid() {
        return Array.from({ length: GRID_SIZE }, () => Array(GRID_SIZE).fill(null));
      }

      function initGame() {
        gameState = 'placement';
        playerGrid = createEmptyGrid();
        enemyGrid = createEmptyGrid();
        playerShips = [];
        enemyShips = [];
        currentShipIndex = 0;
        isHorizontal = true;
        aiHuntTargets = [];
        aiLastHit = null;

        rotateBtn.style.display = 'inline-block';
        randomBtn.style.display = 'inline-block';
        rotateBtn.textContent = 'Rotate Ship (Horizontal)';

        placeEnemyShips();
        renderGrids();
        updatePlacementStatus();
      }

      function updatePlacementStatus() {
        if (currentShipIndex < SHIPS_DEF.length) {
          const ship = SHIPS_DEF[currentShipIndex];
          statusEl.textContent = `Place your ${ship.name} (${ship.size} cells)`;
        } else {
          gameState = 'playing';
          rotateBtn.style.display = 'none';
          randomBtn.style.display = 'none';
          statusEl.textContent = 'Fleet ready! Click Enemy Waters to strike!';
          renderGrids();
        }
      }

      function placeEnemyShips() {
        for (let shipDef of SHIPS_DEF) {
          let placed = false;
          while (!placed) {
            const horiz = Math.random() < 0.5;
            const r = Math.floor(Math.random() * GRID_SIZE);
            const c = Math.floor(Math.random() * GRID_SIZE);

            if (canPlaceShip(enemyGrid, r, c, shipDef.size, horiz)) {
              const shipObj = { name: shipDef.name, size: shipDef.size, hits: 0, sunk: false, cells: [] };
              for (let i = 0; i < shipDef.size; i++) {
                let nr = horiz ? r : r + i;
                let nc = horiz ? c + i : c;
                enemyGrid[nr][nc] = shipObj;
                shipObj.cells.push({ r: nr, c: nc });
              }
              enemyShips.push(shipObj);
              placed = true;
            }
          }
        }
      }

      function canPlaceShip(grid, r, c, size, horiz) {
        for (let i = 0; i < size; i++) {
          let nr = horiz ? r : r + i;
          let nc = horiz ? c + i : c;
          if (nr < 0 || nr >= GRID_SIZE || nc < 0 || nc >= GRID_SIZE) return false;
          if (grid[nr][nc] !== null) return false;
        }
        return true;
      }

      function renderGrids() {
        // Player Grid
        playerGridEl.innerHTML = '';
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const val = playerGrid[r][c];

            if (val === 'H') cell.classList.add('hit');
            else if (val === 'M') cell.classList.add('miss');
            else if (val && typeof val === 'object') {
              cell.classList.add('ship');
              if (val.sunk) cell.classList.add('sunk');
            }

            if (gameState === 'placement') {
              cell.addEventListener('mouseenter', () => handlePlacementHover(r, c, true));
              cell.addEventListener('mouseleave', () => handlePlacementHover(r, c, false));
              cell.addEventListener('click', () => handlePlacementClick(r, c));
            }

            playerGridEl.appendChild(cell);
          }
        }

        // Enemy Grid
        enemyGridEl.innerHTML = '';
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            const val = enemyGrid[r][c];

            if (val === 'H' || (typeof val === 'object' && val && val.isHitCell)) {
              cell.classList.add('hit');
            } else if (val === 'M') {
              cell.classList.add('miss');
            }

            if (typeof val === 'object' && val && val.sunk) {
              cell.classList.add('sunk');
            }

            if (gameState === 'playing' && val !== 'H' && val !== 'M' && !(typeof val === 'object' && val && val.isHitCell)) {
              cell.addEventListener('click', () => handlePlayerFire(r, c));
            }

            enemyGridEl.appendChild(cell);
          }
        }
      }

      function handlePlacementHover(r, c, isEnter) {
        if (gameState !== 'placement' || currentShipIndex >= SHIPS_DEF.length) return;
        const size = SHIPS_DEF[currentShipIndex].size;
        const isValid = canPlaceShip(playerGrid, r, c, size, isHorizontal);

        for (let i = 0; i < size; i++) {
          let nr = isHorizontal ? r : r + i;
          let nc = isHorizontal ? c + i : c;
          if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
            const index = nr * GRID_SIZE + nc;
            const cell = playerGridEl.children[index];
            if (cell) {
              if (isEnter) {
                cell.classList.add(isValid ? 'preview-valid' : 'preview-invalid');
              } else {
                cell.classList.remove('preview-valid', 'preview-invalid');
              }
            }
          }
        }
      }

      function handlePlacementClick(r, c) {
        if (gameState !== 'placement' || currentShipIndex >= SHIPS_DEF.length) return;
        const shipDef = SHIPS_DEF[currentShipIndex];

        if (canPlaceShip(playerGrid, r, c, shipDef.size, isHorizontal)) {
          const shipObj = { name: shipDef.name, size: shipDef.size, hits: 0, sunk: false, cells: [] };
          for (let i = 0; i < shipDef.size; i++) {
            let nr = isHorizontal ? r : r + i;
            let nc = isHorizontal ? c + i : c;
            playerGrid[nr][nc] = shipObj;
            shipObj.cells.push({ r: nr, c: nc });
          }
          playerShips.push(shipObj);
          currentShipIndex++;
          renderGrids();
          updatePlacementStatus();
        }
      }

      function randomizePlayerShips() {
        playerGrid = createEmptyGrid();
        playerShips = [];
        for (let shipDef of SHIPS_DEF) {
          let placed = false;
          while (!placed) {
            const horiz = Math.random() < 0.5;
            const r = Math.floor(Math.random() * GRID_SIZE);
            const c = Math.floor(Math.random() * GRID_SIZE);

            if (canPlaceShip(playerGrid, r, c, shipDef.size, horiz)) {
              const shipObj = { name: shipDef.name, size: shipDef.size, hits: 0, sunk: false, cells: [] };
              for (let i = 0; i < shipDef.size; i++) {
                let nr = horiz ? r : r + i;
                let nc = horiz ? c + i : c;
                playerGrid[nr][nc] = shipObj;
                shipObj.cells.push({ r: nr, c: nc });
              }
              playerShips.push(shipObj);
              placed = true;
            }
          }
        }
        currentShipIndex = SHIPS_DEF.length;
        updatePlacementStatus();
      }

      function handlePlayerFire(r, c) {
        if (gameState !== 'playing') return;

        const val = enemyGrid[r][c];
        if (val === 'M' || val === 'H' || (typeof val === 'object' && val && val.isHitCell)) return;

        if (typeof val === 'object' && val !== null) {
          // Hit!
          val.hits++;
          val.cells.find(cell => cell.r === r && cell.c === c).hit = true;
          enemyGrid[r][c] = { isHitCell: true, ship: val, sunk: val.hits >= val.size };

          if (val.hits >= val.size) {
            val.sunk = true;
            statusEl.textContent = `BOOM! You sunk AI's ${val.name}!`;
          } else {
            statusEl.textContent = `HIT on AI's fleet at ${String.fromCharCode(65 + r)}${c + 1}!`;
          }
        } else {
          // Miss
          enemyGrid[r][c] = 'M';
          statusEl.textContent = `Missed at ${String.fromCharCode(65 + r)}${c + 1}. AI's turn...`;
        }

        renderGrids();

        if (enemyShips.every(s => s.sunk)) {
          gameState = 'gameover';
          statusEl.textContent = 'VICTORY! You destroyed all enemy ships!';
          return;
        }

        // AI turn after short delay
        gameState = 'ai-turn';
        setTimeout(makeAIFire, 600);
      }

      function makeAIFire() {
        if (gameState !== 'ai-turn') return;

        let target = null;

        // Try hunt targets first
        while (aiHuntTargets.length > 0) {
          const t = aiHuntTargets.shift();
          const currentVal = playerGrid[t.r][t.c];
          if (currentVal !== 'M' && currentVal !== 'H' && !(typeof currentVal === 'object' && currentVal && currentVal.isHitCell)) {
            target = t;
            break;
          }
        }

        // Otherwise random fire with checkerboard pattern preference
        if (!target) {
          const openCells = [];
          for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
              const val = playerGrid[r][c];
              if (val !== 'M' && val !== 'H' && !(typeof val === 'object' && val && val.isHitCell)) {
                openCells.push({ r, c, parity: (r + c) % 2 === 0 });
              }
            }
          }

          if (openCells.length > 0) {
            const parityCells = openCells.filter(cell => cell.parity);
            if (parityCells.length > 0) {
              target = parityCells[Math.floor(Math.random() * parityCells.length)];
            } else {
              target = openCells[Math.floor(Math.random() * openCells.length)];
            }
          }
        }

        if (!target) return;

        const r = target.r;
        const c = target.c;
        const val = playerGrid[r][c];

        if (typeof val === 'object' && val !== null) {
          // AI Hit!
          val.hits++;
          playerGrid[r][c] = { isHitCell: true, ship: val, sunk: val.hits >= val.size };

          if (val.hits >= val.size) {
            val.sunk = true;
            statusEl.textContent = `AI sunk your ${val.name}!`;
            aiHuntTargets = aiHuntTargets.filter(t => playerGrid[t.r][t.c]?.ship !== val);
          } else {
            statusEl.textContent = `AI HIT your ${val.name}!`;
            // Add adjacents to hunt targets
            const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
            for (let [dr, dc] of dirs) {
              let nr = r + dr;
              let nc = c + dc;
              if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                const nval = playerGrid[nr][nc];
                if (nval !== 'M' && !(typeof nval === 'object' && nval && nval.isHitCell)) {
                  aiHuntTargets.unshift({ r: nr, c: nc });
                }
              }
            }
          }
        } else {
          // AI Miss
          playerGrid[r][c] = 'M';
          statusEl.textContent = `AI fired at ${String.fromCharCode(65 + r)}${c + 1} and missed. Your turn!`;
        }

        renderGrids();

        if (playerShips.every(s => s.sunk)) {
          gameState = 'gameover';
          statusEl.textContent = 'DEFEAT! All your ships were sunk!';
          return;
        }

        gameState = 'playing';
      }

      rotateBtn.addEventListener('click', () => {
        isHorizontal = !isHorizontal;
        rotateBtn.textContent = `Rotate Ship (${isHorizontal ? 'Horizontal' : 'Vertical'})`;
      });

      randomBtn.addEventListener('click', () => {
        randomizePlayerShips();
        renderGrids();
      });

      restartBtn.addEventListener('click', initGame);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'r' || e.key === 'R') {
          isHorizontal = !isHorizontal;
          rotateBtn.textContent = `Rotate Ship (${isHorizontal ? 'Horizontal' : 'Vertical'})`;
        }
      });

      initGame();
    })();
  </script>
</body>
</html>
