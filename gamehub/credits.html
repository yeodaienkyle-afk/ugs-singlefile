<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Credits - powerenkyle2</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;

        font-family: Arial, Helvetica, sans-serif;
        color: white;

        background:
            radial-gradient(
                ellipse at center,
                #19192c 0%,
                #0b0b14 45%,
                #020204 100%
            );
    }

    /* Atmospheric glow */
    body::before {
        content: "";
        position: fixed;
        inset: 0;

        background:
            radial-gradient(
                ellipse at center,
                rgba(115, 105, 255, 0.16),
                transparent 55%
            );

        animation: atmosphere 6s ease-in-out infinite alternate;

        pointer-events: none;
    }

    /* Cinematic horizontal light */
    body::after {
        content: "";
        position: fixed;

        width: 100%;
        height: 2px;

        top: 50%;
        left: 0;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(150, 140, 255, 0.5),
                transparent
            );

        filter: blur(2px);
        opacity: 0.5;

        pointer-events: none;
    }

    .credits {
        position: relative;

        z-index: 2;

        text-align: center;

        padding: 40px;

        animation:
            entrance 2s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    /* Top text */
    .intro {
        margin-bottom: 25px;

        font-size: 11px;
        font-weight: 500;

        letter-spacing: 8px;

        text-transform: uppercase;

        color: #85859a;

        animation:
            fadeUp 1.5s ease 0.3s both;
    }

    /* Main name */
    .name {
        margin: 0;

        font-size: clamp(55px, 10vw, 125px);

        font-weight: 800;

        letter-spacing: -5px;

        background:
            linear-gradient(
                110deg,
                #ffffff 0%,
                #c8c5ff 35%,
                #ffffff 50%,
                #8880ff 75%,
                #ffffff 100%
            );

        background-size: 250% 100%;

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;

        animation:
            shine 6s linear infinite,
            glow 4s ease-in-out infinite alternate;

        filter:
            drop-shadow(
                0 0 25px rgba(120, 110, 255, 0.25)
            );
    }

    /* Divider */
    .divider {
        width: 160px;
        height: 1px;

        margin: 35px auto;

        background:
            linear-gradient(
                90deg,
                transparent,
                #9a94ff,
                transparent
            );

        box-shadow:
            0 0 10px rgba(130, 120, 255, 0.8),
            0 0 30px rgba(100, 90, 255, 0.3);

        animation:
            expand 1.5s ease 1s both;
    }

    /* Credit columns */
    .credits-info {
        display: flex;

        justify-content: center;

        gap: 90px;

        animation:
            fadeUp 1.5s ease 1.2s both;
    }

    .credit {
        min-width: 190px;
    }

    .label {
        margin-bottom: 12px;

        font-size: 10px;
        letter-spacing: 4px;
        text-transform: uppercase;

        color: #666679;
    }

    .value {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 1px;

        color: #eeeeff;

        text-shadow:
            0 0 15px rgba(150, 145, 255, 0.25);
    }

    /* Main site button */
    .main-site {
        display: inline-block;

        margin-top: 55px;

        padding: 14px 28px;

        border: 1px solid rgba(150, 140, 255, 0.45);

        border-radius: 999px;

        background:
            rgba(110, 100, 255, 0.08);

        color: #eeeeff;

        font-size: 11px;
        font-weight: 600;
        letter-spacing: 3px;

        text-decoration: none;
        text-transform: uppercase;

        box-shadow:
            0 0 20px rgba(100, 90, 255, 0.08);

        backdrop-filter: blur(8px);

        transition:
            transform 0.3s ease,
            background 0.3s ease,
            box-shadow 0.3s ease,
            border-color 0.3s ease;

        animation:
            fadeUp 1.5s ease 1.5s both;
    }

    .main-site:hover {
        transform:
            translateY(-3px)
            scale(1.03);

        background:
            rgba(120, 110, 255, 0.2);

        border-color:
            rgba(170, 160, 255, 0.9);

        box-shadow:
            0 0 30px rgba(110, 100, 255, 0.3),
            0 0 60px rgba(100, 90, 255, 0.12);
    }

    .main-site:active {
        transform:
            translateY(0)
            scale(0.98);
    }

    /* Footer */
    .footer {
        margin-top: 45px;

        font-size: 9px;

        letter-spacing: 4px;

        text-transform: uppercase;

        color: #414152;

        animation:
            fadeUp 1.5s ease 1.8s both;
    }

    /* Animations */

    @keyframes entrance {
        from {
            opacity: 0;
            transform: scale(0.96);
        }

        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes expand {
        from {
            width: 0;
            opacity: 0;
        }

        to {
            width: 160px;
            opacity: 1;
        }
    }

    @keyframes shine {
        0% {
            background-position: 250% 0;
        }

        100% {
            background-position: -250% 0;
        }
    }

    @keyframes glow {
        from {
            filter:
                drop-shadow(
                    0 0 15px rgba(120, 110, 255, 0.15)
                );
        }

        to {
            filter:
                drop-shadow(
                    0 0 35px rgba(120, 110, 255, 0.35)
                );
        }
    }

    @keyframes atmosphere {
        from {
            opacity: 0.5;
            transform: scale(1);
        }

        to {
            opacity: 1;
            transform: scale(1.12);
        }
    }

    /* Mobile */
    @media (max-width: 600px) {

        .credits {
            padding: 25px;
        }

        .credits-info {
            gap: 35px;
        }

        .credit {
            min-width: 140px;
        }

        .name {
            letter-spacing: -3px;
        }

        .main-site {
            margin-top: 45px;
        }
    }
</style>
</head>

<body>

<div class="credits">

    <div class="intro">
        Written &amp; Created By
    </div>

    <h1 class="name">
        powerenkyle2
    </h1>

    <div class="divider"></div>

    <div class="credits-info">

        <div class="credit">
            <div class="label">
                Owner
            </div>

            <div class="value">
                powerenkyle2
            </div>
        </div>

        <div class="credit">
            <div class="label">
                Distributed To
            </div>

            <div class="value">
                Cloaked
            </div>
        </div>

    </div>

    <a
        class="main-site"
        href="https://sites.google.com/view/mr-tan-free-tutoring/home"
    >
        Visit Our Main Site
    </a>

    <div class="footer">
        © 2026 powerenkyle2 · All Rights Reserved
    </div>

</div>

</body>
</html>
