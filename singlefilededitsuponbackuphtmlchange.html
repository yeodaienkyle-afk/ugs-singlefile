<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
    <title>UGS</title>
</head>
<body>

<div id="app"></div>

<script>
fetch("backup.html?t=" + Date.now())
    .then(response => { if (!response.ok) throw new Error(response.status); return response.text(); })
    .catch(() => fetch("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@main/backup.html?t=" + Date.now()).then(r => r.text()))
    .then(html => {
        document.open();
        document.write(html);
        document.close();
    })
    .catch(error => {
        document.body.innerHTML = "Failed to load: " + error;
    });
</script>

</body>
</html>
