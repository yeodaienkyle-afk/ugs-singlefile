<!DOCTYPE html>
<html>
<head>
    <title>UGS</title>
</head>
<body>

<div id="app"></div>

<script>
fetch("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@patch-1/backup.html")
    .then(response => response.text())
    .then(html => {
        document.open();
        document.write(html);
        document.close();
    })
    .catch(error => {
        document.body.innerHTML = "Failed to load: " + error;
    });
</script>

</body>
</html>
