<script>

document.addEventListener("DOMContentLoaded", function () {

    const searchInput =
        document.getElementById("searchInput");

    if (searchInput) {

        searchInput.addEventListener("input", function () {

            const query =
                this.value.toLowerCase().trim();

            const sections =
                document.querySelectorAll(".letter-section");

            sections.forEach(function (section) {

                const buttons =
                    section.querySelectorAll(
                        'input[type="button"]'
                    );

                let anyVisible = false;

                buttons.forEach(function (btn) {

                    const label =
                        btn.value.toLowerCase();

                    const matches =
                        query === "" ||
                        label.includes(query);

                    btn.style.display =
                        matches ? "" : "none";

                    if (matches) {
                        anyVisible = true;
                    }

                });

                if (buttons.length > 0) {
                    section.style.display =
                        anyVisible ? "" : "none";
                }

            });

        });

    }

    const fallbackButton =
        document.getElementById("lolbutton");

    if (fallbackButton) {

        fallbackButton.addEventListener("click", function () {

            if (document.getElementById("fallback-script")) {
                return;
            }

            const script =
                document.createElement("script");

            script.id = "fallback-script";

                console.log("Fallback script loaded.");
            };

                console.error("Fallback script failed to load.");
            };

            document.body.appendChild(script);

        });

    }

});

    var count = 220;

    for (var i = 0; i < count; i++) {

        var star =
            document.createElement('div');

        star.className = 'star';

        var size =
            Math.random() * 1.8 + 0.5;

        var top =
            Math.random() * 65;

        var left =
            Math.random() * 100;

        var duration =
            (Math.random() * 3 + 2).toFixed(2);

        var delay =
            (Math.random() * 5).toFixed(2);

        var minOp =
            (Math.random() * 0.3 + 0.1).toFixed(2);

        var maxOp =
            (Math.random() * 0.4 + 0.6).toFixed(2);

        star.style.width =
            size + 'px';

        star.style.height =
            size + 'px';

        star.style.top =
            top + '%';

        star.style.left =
            left + '%';

        star.style.setProperty(
            '--min-op',
            minOp
        );

        star.style.setProperty(
            '--max-op',
            maxOp
        );

        star.style.animationDuration =
            duration + 's';

        star.style.animationDelay =
            delay + 's';

        if (size > 1.6) {

            star.style.boxShadow =
                '0 0 ' +
                (size * 2) +
                'px rgba(255,255,255,0.6)';

        }

        sky.appendChild(star);

    }

})();
