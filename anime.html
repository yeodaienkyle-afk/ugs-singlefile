<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime</title>
<link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
<style>
:root{--bg:#0b0d12;--card:#13161f;--line:#232838;--ink:#e8eaed;--muted:#9aa3b2;--accent:#a46bff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif;padding:24px 18px 60px}
header{max-width:1400px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
h1{font-size:24px;font-weight:800;background:linear-gradient(90deg,#ff5f6d,#ffc371,#47f0a3,#4facfe,#a46bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.count{color:var(--muted);font-size:13px}
.tools{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
input,select{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 12px;font:14px inherit;outline:none}
input{min-width:220px}
input:focus,select:focus{border-color:var(--accent)}
.note{max-width:1400px;margin:0 auto 20px;font-size:13px;color:var(--muted);background:#101420;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.note a{color:var(--accent)}
.grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .16s,border-color .16s,box-shadow .16s}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 26px rgba(164,107,255,.22)}
.shot{position:relative;aspect-ratio:2/3;background:#0e1119}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.rate{position:absolute;top:8px;right:8px;background:rgba(10,12,18,.86);border:1px solid var(--line);color:#ffd166;font-weight:700;font-size:12px;padding:3px 8px;border-radius:999px}
.rate.na{color:var(--muted);font-weight:600}
.name{padding:10px 12px 12px;font-weight:600;font-size:13.5px;line-height:1.35}
.empty{max-width:1400px;margin:40px auto;color:var(--muted);text-align:center}
@media (max-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}}
</style>
</head>
<body>
<header>
  <h1>Anime</h1>
  <span class="count" id="count"></span>
  <div class="tools">
    <input id="q" type="search" placeholder="search titles..." autocomplete="off">
    <select id="sort">
      <option value="rating">rating</option>
      <option value="az">A to Z</option>
    </select>
  </div>
</header>

var grid = document.getElementById("grid"), empty = document.getElementById("empty"),
    q = document.getElementById("q"), sortSel = document.getElementById("sort"),
    count = document.getElementById("count");

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function render(){
  var term = q.value.trim().toLowerCase(), mode = sortSel.value;
  var list = CARDS.filter(function(c){ return !term || c.t.toLowerCase().indexOf(term) !== -1; });
  if (mode === "az") list = list.slice().sort(function(a,b){ return a.t.localeCompare(b.t); });
  else list = list.slice().sort(function(a,b){ return (b.s||0) - (a.s||0) || a.t.localeCompare(b.t); });

  grid.innerHTML = list.map(function(c){
    var r = c.s ? '<span class="rate">' + (c.s/10).toFixed(1) + '</span>' : '<span class="rate na">&ndash;</span>';
    var img = '<img src="' + esc(c.p) + '" alt="' + esc(c.t) + '" loading="lazy" decoding="async"';
    if (c.f) img += ' onerror="this.onerror=null;this.src=this.getAttribute(\'data-f\')" data-f="' + esc(c.f) + '"';
    img += '>';
    return '<a class="card" href="' + esc(c.u) + '" target="_blank" rel="noopener">' +
             '<div class="shot">' + r + img + '</div>' +
             '<div class="name">' + esc(c.t) + '</div>' +
           '</a>';
  }).join("");
  count.textContent = list.length + " of " + CARDS.length + " shows";
  empty.hidden = list.length > 0;
}
q.addEventListener("input", render);
sortSel.addEventListener("change", render);
render();
</script>
