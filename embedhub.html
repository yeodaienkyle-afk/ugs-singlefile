<div id="stage">

  </div>
  <iframe id="frame" allow="autoplay; fullscreen; gamepad; clipboard-write" allowfullscreen></iframe>

<script>
function play(execId) {
  var url = "https://script.google.com/macros/s/" + execId + "/exec";
  var stage = document.getElementById('stage');
  document.getElementById('frame').src = url;
  var a = document.getElementById('openTab');
  a.href = url; a.style.display = 'inline-block';
  stage.style.display = 'block';
  document.title = 'Home';
}
function closeStage() {
  document.getElementById('stage').style.display = 'none';
  document.getElementById('frame').src = 'about:blank';
}
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeStage(); });
function filterList(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('.letter-section').forEach(function (sec) {
    var any = false;
    sec.querySelectorAll('input[type=button]').forEach(function (b) {
      var m = !q || b.value.toLowerCase().includes(q);
      b.style.display = m ? '' : 'none';
      if (m) any = true;
    });
    sec.style.display = any ? '' : 'none';
  });
}
</script>
