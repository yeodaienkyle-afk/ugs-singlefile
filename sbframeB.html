<!doctype html><meta charset=utf-8><title>frameB</title><body>
<script>
var stage = localStorage.getItem('bstage') || '';
localStorage.setItem('ugs:auth', JSON.stringify({username:'tester',token:'a.b.c'}));
window.__UGS_GAME_ID='cltest2';
window.__UGS_API='https://fake.example/ugsAccount';
window.fetch=function(){ return Promise.resolve({ ok:true, json:function(){ return Promise.resolve({ saved:true, payload: JSON.stringify({ v:1, game:'cltest2', at:'2020-01-01T00:00:00.000Z', local:{'g:best':'99'}, idb:{} }) }); } }); };
if (stage === '') { localStorage.setItem('bstage','1'); localStorage.removeItem('g:best'); }
else if (stage === '1') { localStorage.setItem('test:B', (localStorage.getItem('g:best')==='99' ? 'PASS' : 'FAIL(best='+localStorage.getItem('g:best')+')')); localStorage.setItem('bstage','2'); }
</script>
<script>
(function () {
  var API = window.__UGS_API || 'https://superagent-49ac7abc.base44.app/functions/ugsAccount';
  var GAME = window.__UGS_GAME_ID || '';
  var AUTH = null;
  try { AUTH = JSON.parse(localStorage.getItem('ugs:auth') || 'null'); } catch (e) {}
  if (!AUTH || !AUTH.token || !GAME) return;

  var HUB_KEYS = /^(ugs:auth|ugs:game:|ugs:cache|ug_view|__ugs)/;
  var MAX = 1900000;
  var BDB = 'ugs:backup', BSTORE = 'snaps';

  function el(tag, css, txt) {
    var n = document.createElement(tag);
    if (css) n.style.cssText = css;
    if (txt) n.textContent = txt;
    return n;
  }

  var wrap = el('div', 'position:fixed;right:12px;bottom:12px;z-index:2147483647;display:flex;align-items:center;gap:6px;font:12px/1.2 system-ui,sans-serif;background:rgba(20,20,24,.92);color:#eee;border-radius:10px;padding:6px 8px;box-shadow:0 4px 18px rgba(0,0,0,.45);user-select:none');
  var status = el('span', 'opacity:.75;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap', '@' + AUTH.username);

  function btn(label, bg, fn) {
    var b = el('button', 'appearance:none;border:0;border-radius:7px;padding:5px 10px;font:600 12px system-ui,sans-serif;color:#fff;cursor:pointer;background:' + bg, label);
    b.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); fn(b); };
    wrap.appendChild(b);
    return b;
  }

  function say(msg) { status.textContent = msg; status.style.opacity = '1'; }

  /* ---------- device copy (works with no network) ---------- */
  function openB() {
    return new Promise(function (res, rej) {
      try {
        var r = indexedDB.open(BDB, 1);
        r.onupgradeneeded = function () {
          var db = r.result;
          if (!db.objectStoreNames.contains(BSTORE)) db.createObjectStore(BSTORE);
        };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error || 1); };
      } catch (e) { rej(e); }
    });
  }

  function bSave(payload) {
    return openB().then(function (db) {
      return new Promise(function (res) {
        try {
          var tx = db.transaction(BSTORE, 'readwrite');
          tx.objectStore(BSTORE).put({ payload: payload, at: Date.now() }, GAME);
          tx.oncomplete = function () { db.close(); res(true); };
          tx.onerror = function () { db.close(); res(false); };
        } catch (e) { res(false); }
      });
    }).catch(function () { return false; });
  }

  function bLoad() {
    return openB().then(function (db) {
      return new Promise(function (res) {
        try {
          var tx = db.transaction(BSTORE, 'readonly');
          var q = tx.objectStore(BSTORE).get(GAME);
          q.onsuccess = function () { db.close(); res(q.result || null); };
          q.onerror = function () { db.close(); res(null); };
        } catch (e) { res(null); }
      });
    }).catch(function () { return null; });
  }

  /* ---------- snapshot ---------- */
  function collectLocal() {
    var out = {};
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (!k || HUB_KEYS.test(k)) continue;
      out[k] = localStorage.getItem(k);
    }
    return out;
  }

  function collectIdb() {
    return new Promise(function (resolve) {
      var result = {};
      var dbs = (indexedDB && indexedDB.databases) ? indexedDB.databases() : Promise.resolve([]);
      Promise.resolve(dbs).then(function (list) {
        var dbs2 = (list || []).map(function (d) { return d.name; }).filter(function (n) { return n && n !== BDB; });
        var i = 0;
        function nextDb() {
          if (i >= dbs2.length) return resolve(result);
          var name = dbs2[i++], req;
          try { req = indexedDB.open(name); } catch (e) { return nextDb(); }
          req.onerror = function () { nextDb(); };
          req.onsuccess = function () {
            var db = req.result, stores = Array.prototype.slice.call(db.objectStoreNames || []), j = 0, out = {};
            function nextStore() {
              if (j >= stores.length) { db.close(); result[name] = out; return nextDb(); }
              var sName = stores[j++];
              try {
                var tx = db.transaction(sName, 'readonly'), st = tx.objectStore(sName);
                var keysReq = st.getAllKeys();
                keysReq.onerror = function () { nextStore(); };
                keysReq.onsuccess = function () {
                  var keys = keysReq.result || [];
                  var valsReq = st.getAll();
                  valsReq.onerror = function () { nextStore(); };
                  valsReq.onsuccess = function () {
                    var vals = valsReq.result || [];
                    out[sName] = keys.map(function (k, idx) {
                      var v = vals[idx];
                      try { v = JSON.parse(JSON.stringify(v)); } catch (e) { v = null; }
                      return { k: k, v: v };
                    });
                    nextStore();
                  };
                };
              } catch (e) { nextStore(); }
            }
            nextStore();
          };
        }
        nextDb();
      }).catch(function () { resolve(result); });
      setTimeout(function () { resolve(result); }, 6000);
    });
  }

  function snapshot() {
    return collectIdb().then(function (idb) {
      return JSON.stringify({ v: 1, game: GAME, at: new Date().toISOString(), local: collectLocal(), idb: idb });
    });
  }

  function post(payload) {
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); });
  }

  function snapAt(json) { try { return Date.parse(JSON.parse(json).at) || 0; } catch (e) { return 0; } }

  function restore(json) {
    var data;
    try { data = JSON.parse(json); } catch (e) { say('save is corrupt'); return; }
    Object.keys(data.local || {}).forEach(function (k) {
      try { localStorage.setItem(k, data.local[k]); } catch (e) {}
    });
    var idbAll = data.idb || {}, names = Object.keys(idbAll);
    if (!names.length) { say('restored, reloading'); setTimeout(function () { location.reload(); }, 600); return; }
    var i = 0;
    (function nextDb() {
      if (i >= names.length) { say('restored, reloading'); setTimeout(function () { location.reload(); }, 600); return; }
      var name = names[i++], req;
      try { req = indexedDB.open(name); } catch (e) { return nextDb(); }
      req.onerror = function () { nextDb(); };
      req.onsuccess = function () {
        var db = req.result, stores = Object.keys(idbAll[name] || {}), j = 0;
        (function nextStore() {
          if (j >= stores.length) { db.close(); return nextDb(); }
          var sName = stores[j++];
          try {
            var tx = db.transaction(sName, 'readwrite'), st = tx.objectStore(sName);
            (idbAll[name][sName] || []).forEach(function (row) {
              try { st.put(row.v, row.k); } catch (e) {}
            });
            tx.oncomplete = nextStore;
            tx.onerror = nextStore;
          } catch (e) { nextStore(); }
        })();
      };
    })();
  }

  /* ---------- buttons ---------- */
  btn('Save', '#2f7d32', function (b) {
    b.disabled = true;
    say('saving...');
    snapshot().then(function (json) {
      if (json.length > MAX) { say('too big for a save'); return; }
      var kb = Math.round(json.length / 1024);
      return bSave(json).then(function (kept) {
        return post({ action: 'save', token: AUTH.token, gameId: GAME, payload: json }).then(function (res) {
          if (res && res.ok) say('saved ' + kb + 'KB');
          else say(kept ? 'saved here (no cloud)' : 'save failed');
        }, function () {
          say(kept ? 'saved here (no cloud)' : 'save failed');
        });
      });
    }).catch(function () { say('save failed'); })
      .then(function () { b.disabled = false; });
  });

  btn('Load', '#37568a', function (b) {
    b.disabled = true;
    say('loading...');
    var remote = post({ action: 'load', token: AUTH.token, gameId: GAME }).then(function (r) {
      if (r && r.ok && r.body && r.body.saved && r.body.payload) return { payload: r.body.payload };
      return null;
    }, function () { return null; });
    Promise.all([remote, bLoad()]).then(function (a) {
      var r = a[0], l = a[1], pick = null;
      if (r && l) pick = snapAt(l.payload) > snapAt(r.payload) ? l : r;
      else pick = r || l;
      if (!pick) { say('no save yet'); return; }
      if (pick === l) post({ action: 'save', token: AUTH.token, gameId: GAME, payload: l.payload }).catch(function () {});
      restore(pick.payload);
    }).catch(function () { say('load failed'); })
      .then(function () { b.disabled = false; });
  });

  btn('\u00d7', '#3a3a42', function () { wrap.remove(); });

  function mount() { try { document.body.appendChild(wrap); } catch (e) {} }
  if (document.body) mount();
  else document.addEventListener('DOMContentLoaded', mount);
})();

</script>
<script>
function findBtn(t){ var b=document.querySelectorAll('button'); for(var i=0;i<b.length;i++){ if(b[i].textContent===t) return b[i]; } return null; }
if(stage===''){
  setTimeout(function(){ localStorage.setItem('test:B:buttons', String(document.querySelectorAll('button').length)); var l=findBtn('Load'); if(l) l.click(); }, 600);
}
</script></body>
