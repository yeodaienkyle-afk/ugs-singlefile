<script>
function openPage(htmlContent) {
    // Open synchronously inside the click handler so popup blockers can allow it.
    var win;
    try {
        win = window.open("about:blank", "_blank");
        if (!win) {
            alert("Popup blocked. Allow pop-ups for this site, then click again.");
            return null;
        }
        win.document.open();
        win.document.write(String(htmlContent || ""));
        win.document.close();
        try { win.focus(); } catch (e) {}
        return win;
    } catch (error) {
        try { if (win && !win.closed) win.close(); } catch (e) {}
        alert("The page could not be opened. Please try again or allow pop-ups for this site.");
        return null;
    }
}

document.querySelectorAll(".nav-card").forEach(function (card) {

    card.setAttribute("tabindex", "0");
    card.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); } });
});

(function () {
    var els = [document.getElementById("site-title"), document.getElementById("hero-logo")].filter(Boolean);
    var SITE_URL = "https://sites.google.com/view/mr-tan-free-tutoring/home";
    var shown = [els.length ? els[0].textContent.trim() : ""];
    function step() {
        var pool = TITLE_PHRASES.filter(function (p) { return shown.indexOf(p) === -1; });
        if (pool.length === 0) { shown = shown.slice(-1); pool = TITLE_PHRASES.filter(function (p) { return shown.indexOf(p) === -1; }); }
        var pick = pool[Math.floor(Math.random() * pool.length)];
        shown.push(pick);
        if (shown.length > 10) { shown.shift(); }
        els.forEach(function (el) { el.textContent = pick; el.classList.toggle("is-link", pick === "visit main site"); });
    }
    setInterval(function () { if (!document.hidden) { step(); } }, 10000);
    els.forEach(function (el) {
        el.addEventListener("click", function () { if (el.textContent.trim() === "visit main site") { window.open(SITE_URL, "_blank"); } });
    });
})();
</script>

<script>
(function () {

        var n = 0;
        document.querySelectorAll('.buttons-container input[type="button"]').forEach(function(b){ if(b.offsetParent!==null) n++; });
        document.querySelectorAll(".gcard").forEach(function(c){ if(!c.classList.contains("mini") && c.offsetParent!==null) n++; });
        var queryActive = !!(searchInput && searchInput.value.trim());
        countEl.textContent = n > 0 ? (n + (n === 1 ? " game" : " games")) : (queryActive ? "0 games" : "loading games...");
    }
    if (searchInput) {
        var searchTimer = null;
        function runSearch() {
            var query = searchInput.value.toLowerCase().trim();
            var total = 0;
            var cardsMode = document.body.classList.contains("cardmode");
            document.querySelectorAll(".letter-section").forEach(function (section) {
                var anyVisible = false;
                section.querySelectorAll('input[type="button"]').forEach(function (btn) {
                    var ok = query === "" || btn.value.toLowerCase().indexOf(query) !== -1;
                    btn.style.display = ok ? "" : "none";
                    if (ok) {
                        anyVisible = true;
                        if (!cardsMode) total++;
                    }
                });
                section.querySelectorAll(".gcard").forEach(function (card) {
                    var name = card.getAttribute("data-name") || "";
                    var ok = query === "" || name.toLowerCase().indexOf(query) !== -1;
                    card.style.display = ok ? "" : "none";
                    if (ok) {
                        anyVisible = true;
                        if (cardsMode && !card.classList.contains("mini")) total++;
                    }
                });
                section.style.display = anyVisible ? "" : "none";
            });
            var empty = document.getElementById("search-empty");
            if (query && total === 0) {
                if (!empty) {
                    empty = document.createElement("div");

                    empty.style.cssText = "text-align:center;padding:60px 20px;color:#9aa3b2;font-size:15px;";
                    document.getElementById("sections-container").appendChild(empty);
                }
                empty.textContent = "no games match \"" + query + "\"";
            } else if (empty) {
                empty.remove();
            }
            updateCount();
        }
        searchInput.addEventListener("input", function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(runSearch, 80);
        });
        searchInput.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                this.value = "";
                clearTimeout(searchTimer);
                runSearch();
                this.blur();

        try {
            var d = disguise();
            var existing = doc.querySelectorAll('link[rel~="icon"]');
            if (existing.length === 1 && existing[0].getAttribute("href") === d.href && doc.title === d.title) return;
            for (var i = 0; i < existing.length; i++) existing[i].remove();

    function watch(w) {
        if (!w) return;
        var n = 0;
        function tick() {
            if (!w || w.closed) return;
            try { apply(w.document); } catch (e) { return; }
            if (++n < 25) setTimeout(tick, n < 3 ? 30 : n < 10 ? 150 : 400);
        }
        tick();

            var strips = document.querySelectorAll(".strip");

                var st = state.get(s);

                else if (s.scrollLeft <= 0.5) { s.scrollLeft = 0; st.dir = 1; }

.form-card::before{content:"";position:absolute;inset:-2px;z-index:-1;border-radius:16px;background:conic-gradient(from 0deg,#ff5f6d,#ffc371,#f7ff47,#47f0a3,#4facfe,#a46bff,#ff5f6d);animation:hue 6s linear infinite;opacity:.8}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.form-card::after{content:"";position:absolute;inset:1px;z-index:-1;border-radius:13px;background:var(--card)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.form-card label:first-child{margin-top:0}
input[type="text"],textarea{width:100%;background:#0d1017;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:inherit;font-size:14px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:#a46bff;box-shadow:0 0 10px rgba(164,107,255,.4)}
.send{margin-top:16px;width:100%;height:44px;border:none;border-radius:10px;cursor:pointer;font-family:'Courier New',monospace;font-weight:700;font-size:15px;letter-spacing:1px;color:#0b0d12;background:linear-gradient(90deg,#47f0a3,#4facfe,#a46bff)}
.send:hover{filter:brightness(1.15)}
.note{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.5}
.note a{color:#4facfe}
#sent{display:none;margin-top:14px;padding:10px 12px;border:1px solid rgba(71,240,163,.5);border-radius:9px;color:#47f0a3;font-size:13px}
#cursor-orb{position:fixed;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;--orb-h:210;background:radial-gradient(circle,hsl(var(--orb-h) 95% 62%/.5) 0%,hsl(calc(var(--orb-h) + 75) 95% 60%/.2) 70%,transparent 100%);border:2px solid hsl(var(--orb-h) 95% 72%/.9);box-shadow:0 0 12px hsl(var(--orb-h) 95% 62%/.55);pointer-events:none;z-index:2147483647;will-change:transform;animation:orb-hue 5s linear infinite}
@keyframes orb-hue{from{--orb-h:0}to{--orb-h:360}}
</style>
</head>
<body>
<div class="wrap">
<h1>contact</h1>
<p class="arcade">&gt; INSERT MESSAGE TO SEND &lt;</p>
<form class="form-card" id="cform">
<label for="cname">name</label>
<input type="text" id="cname" name="name" maxlength="80" autocomplete="nickname" placeholder="your name (or don't)">
<label for="cmsg">message</label>

<button class="send" type="submit">SEND IT</button>

</form>

</div>
<div id="cursor-orb"></div>
<script>
(function () {
    var f = document.getElementById("cform");
    var sent = document.getElementById("sent");
    var sendBtn = f.querySelector(".send");
    f.addEventListener("submit", function (e) {
        e.preventDefault();
        var msg = document.getElementById("cmsg").value.trim();
        var name = document.getElementById("cname").value.trim();
        if (!msg) return;
        sendBtn.disabled = true;
        var old = sendBtn.textContent;
        sendBtn.textContent = "sending...";
        fetch("https://superagent-9b1c1681.base44.app/functions/ugsContactSubmit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg, nickname: name })
        }).then(function (r) { return r.ok ? r.json() : Promise.reject(); })
          .then(function (j) { if (!j.ok) return Promise.reject(); sent.textContent = "message received. if you asked for the code, we'll get back to you."; sent.style.display = "block"; f.reset(); })
          .catch(function () { sent.textContent = "couldn't send right now. try again later."; sent.style.display = "block"; })
          .then(function () { sendBtn.disabled = false; sendBtn.textContent = old; });
    });
    var orb = document.getElementById("cursor-orb");
    if (!orb) return;
    var x = -100, y = -100, need = false, scale = 1, scaleTo = 1;
    function paint() {
        need = false;
        scale += (scaleTo - scale) * 0.3;
        if (Math.abs(scaleTo - scale) > 0.01) need = true;
        orb.style.transform = "translate3d(" + x + "px," + y + "px,0) scale(" + scale.toFixed(2) + ")";
        if (need) requestAnimationFrame(paint);
    }
    document.addEventListener("pointermove", function (e) { x = e.clientX; y = e.clientY; if (!need) { need = true; requestAnimationFrame(paint); } }, { passive: true });
    document.addEventListener("pointerover", function (e) {
        scaleTo = (e.target.closest && e.target.closest("button, a, .nav-card, .gcard, .pinbtn, input[type=button]")) ? 1.5 : 1;
        if (!need) { need = true; requestAnimationFrame(paint); }
    }, { passive: true });
})();

<script>
(function () {
    var CL = "https://ssl.gstatic.com/classroom/favicon.png";
    var SL = "https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@main/sls-favicon.png?v=2";
    function disguise() {
        var m = localStorage.getItem("ug_disguise") || "classroom";
        var ic = localStorage.getItem("ug_disguise_favicon") || "";
        var t = localStorage.getItem("ug_disguise_title") || "";
        return { href: ic || (m === "sls" ? SL : CL), title: t || "Home" };
    }
    function apply(doc) {
        try {
            var d = disguise();
            var existing = doc.querySelectorAll('link[rel~="icon"]');
            if (existing.length === 1 && existing[0].getAttribute("href") === d.href && doc.title === d.title) return;
            for (var i = 0; i < existing.length; i++) existing[i].remove();
            var l = doc.createElement("link");
            l.rel = "icon"; l.href = d.href;
            doc.head.appendChild(l);
            doc.title = d.title;
        } catch (e) {}
    }
    function watch(w) {
        if (!w) return;
        var n = 0;
        function tick() {
            if (!w || w.closed) return;
            try { apply(w.document); } catch (e) { return; }
            if (++n < 25) setTimeout(tick, n < 3 ? 30 : n < 10 ? 150 : 400);
        }
        tick();
    }
    var _open = window.open;
    window.open = function () {
        var w = _open.apply(window, arguments);
        if (w) watch(w);
        return w;
    };
    apply(document);
    window.addEventListener("storage", function (e) { if (e.key && e.key.indexOf("ug_") === 0) apply(document); });
})();
</script>
