<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
<title>Home</title>
<style>
:root {
    --ink: #e8eaed;
    --muted: #9aa3b2;
    --line: #232838;
    --bg: #0b0d12;
    --card: #13161f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
}
.appbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    background: #0d1017;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
}
.material {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
    border: none; background: transparent;
}
.material:hover { background: #1c2130; }
svg.icon { width: 22px; height: 22px; fill: #9aa3b2; }
.avatar {
    margin-left: auto;
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #4285f4, #a46bff);
    color: #fff; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(79,172,254,.4);
    user-select: none; flex-shrink: 0;
}
.hero {
    max-width: 1240px; margin: 24px auto 4px; padding: 0 20px;
    display: flex; align-items: center; justify-content: center; gap: 14px;
    flex-wrap: wrap;
}
.title-block { text-align: center; min-width: 0; }
.site-title {
    font-size: clamp(26px, 4.5vw, 42px);
    font-weight: 800;
    line-height: 1.2;
    background: linear-gradient(90deg, #ff5f6d, #ffc371, #f7ff47, #47f0a3, #4facfe, #a46bff, #ff5f6d);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow-slide 6s linear infinite;
    filter: drop-shadow(0 0 14px rgba(164,107,255,.35));
    cursor: default; user-select: none;
    transition: filter .25s ease;
    display: inline-block;
    max-width: 100%;
}
.site-title.is-link { cursor: pointer; filter: drop-shadow(0 0 22px rgba(71,240,163,.65)); }
@keyframes rainbow-slide { to { background-position: 300% 0; } }
.credits {
    margin-top: 8px;
    font-size: 13px; color: var(--muted);
}
.gear-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: transparent; cursor: pointer;
    flex-shrink: 0;
}
.gear-btn:hover { border-color: #a46bff; box-shadow: 0 0 12px rgba(164,107,255,.45); }
.gear-btn svg { width: 20px; height: 20px; fill: var(--muted); }
.settings-panel {
    position: fixed; top: 74px; right: 16px; z-index: 60;
    width: 240px;
    background: #12161f;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.55);
    display: none;
}
.settings-panel.open { display: block; }
.settings-panel h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .8px; }
.set-row { margin-bottom: 12px; }
.set-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.seg { display: flex; gap: 6px; }
.seg button {
    flex: 1; height: 32px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 12px; cursor: pointer;
}
.seg button.active { border-color: #a46bff; color: #fff; box-shadow: 0 0 10px rgba(164,107,255,.4); }
.toggle {
    width: 100%; height: 32px; border-radius: 8px;
    border: 1px solid var(--line); background: transparent;
    color: var(--muted); font-size: 12px; cursor: pointer;
}
.toggle.on { border-color: #47f0a3; color: #fff; box-shadow: 0 0 10px rgba(71,240,163,.35); }
body.noglow * { box-shadow: none !important; }
body.norotate .strip { animation: none !important; }
.toolbar {
    display: flex; align-items: center; gap: 14px;
    max-width: 1240px; margin: 18px auto 6px; padding: 0 20px;
    flex-wrap: wrap;
}
.search-glow {
    flex: 1; min-width: 220px; max-width: 560px;
    padding: 2px; border-radius: 27px;
    background: conic-gradient(from 0deg, #ff5f6d, #ffc371, #f7ff47, #47f0a3, #4facfe, #a46bff, #ff5f6d);
    animation: rainbow-spin 5s linear infinite;
    box-shadow: 0 0 18px rgba(164,107,255,.25);
}
@keyframes rainbow-spin { to { filter: hue-rotate(360deg); } }
.searchbox {
    height: 44px; border-radius: 25px;
    background: #12161f;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
}
.searchbox svg { fill: var(--muted); width: 20px; height: 20px; flex-shrink: 0; }
#searchInput {
    border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--ink); width: 100%;
}
#searchInput::placeholder { color: #6b7385; }
#lolbutton {
    height: 38px; padding: 0 18px;
    border: 1px solid rgba(255,255,255,.14); border-radius: 19px;
    background: #12161f; color: #c9d2e0;
    font-size: 13px; font-weight: 500; cursor: pointer;
}
#lolbutton:hover { border-color: #a46bff; box-shadow: 0 0 12px rgba(164,107,255,.45); color: #fff; }
#sections-container { max-width: 1240px; margin: 0 auto; padding: 10px 20px 40px; }
.letter-section {
    background: transparent;
    margin-bottom: 26px;
}
.letter-header {
    display: inline-flex; align-items: center;
    min-height: 34px;
    padding: 2px 18px;
    border-radius: 10px;
    color: #fff;
    font-size: 17px; font-weight: 700;
    letter-spacing: .5px;
    margin-bottom: 12px;
    text-shadow: 0 0 10px rgba(255,255,255,.35);
}
#sections-container .letter-section:nth-of-type(7n+1) .letter-header { background: linear-gradient(135deg,#7986cb,#303f9f); }
#sections-container .letter-section:nth-of-type(7n+2) .letter-header { background: linear-gradient(135deg,#4285f4,#1a56d6); }
#sections-container .letter-section:nth-of-type(7n+3) .letter-header { background: linear-gradient(135deg,#34a853,#0d652d); }
#sections-container .letter-section:nth-of-type(7n+4) .letter-header { background: linear-gradient(135deg,#f9ab00,#e37400); }
#sections-container .letter-section:nth-of-type(7n+5) .letter-header { background: linear-gradient(135deg,#a142f4,#6f2db8); }
#sections-container .letter-section:nth-of-type(7n+6) .letter-header { background: linear-gradient(135deg,#26a69b,#00796b); }
#sections-container .letter-section:nth-of-type(7n+7) .letter-header { background: linear-gradient(135deg,#f28b82,#c5221f); }
.letter-section.empty { opacity: .55; }
.empty-message { color: var(--muted); font-style: italic; font-size: 13px; padding: 8px 0 4px; }
/* ---------- CARD VIEW: horizontal auto-rotating strip ---------- */
.strip {
    display: flex; gap: 12px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: auto;
    padding: 4px 2px 10px;
    scrollbar-width: none;
}
.strip::-webkit-scrollbar { display: none; }
body.cardmode .strip { display: flex; }
body.listmode .strip { display: none; }
body.cardmode .buttons-container { display: none; }
body.listmode .buttons-container { display: grid; }
.gcard {
    flex: 0 0 196px;
    width: 196px;
    border-radius: 12px;
    background: var(--card);
    border: 1px solid hsl(var(--hue, 210) 95% 60% / .45);
    box-shadow: 0 0 10px hsl(var(--hue, 210) 95% 55% / .20);
    cursor: pointer;
    overflow: hidden;
    transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
    user-select: none;
}
.gcard:hover {
    transform: translateY(-2px);
    border-color: hsl(var(--hue, 210) 95% 68%);
    box-shadow: 0 0 18px hsl(var(--hue, 210) 95% 55% / .6);
}
.gthumb {
    position: relative;
    width: 100%; height: 122px;
    background:
        linear-gradient(135deg, hsl(var(--hue, 210) 80% 22%), #171b26 70%),
        var(--card);
    overflow: hidden;
}
.gthumb img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: top left;
    image-rendering: auto;
    display: none;
}
.gthumb img.loaded { display: block; }
.gthumb .ph {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 800;
    color: hsl(var(--hue, 210) 95% 70% / .85);
    text-shadow: 0 0 14px hsl(var(--hue, 210) 95% 60% / .5);
}
.gthumb img.loaded + .ph { display: none; }
.gmeta { padding: 8px 10px 10px; }
.gtitle {
    font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--ink);
}
.gdesc {
    margin-top: 3px;
    font-size: 11px;
    line-height: 1.35;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 30px;
}
/* ---------- LIST VIEW: dense text grid, no images ---------- */
.buttons-container {
    display: none;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    grid-auto-rows: 40px;
    gap: 9px;
}
body.listmode .buttons-container { display: grid; }
.buttons-container input[type="button"] {
    width: 100%; height: 100%;
    background: #12161f;
    border: 1px solid hsl(var(--hue, 210) 95% 60% / .55);
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    color: var(--ink);
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    --hue: 210;
    box-shadow: 0 0 7px hsl(var(--hue, 210) 95% 55% / .22);
    transition: box-shadow .18s ease, background .18s ease, border-color .18s ease;
}
.buttons-container input[type="button"]:hover {
    background: hsl(var(--hue, 210) 90% 55% / .13);
    border-color: hsl(var(--hue, 210) 95% 68%);
    box-shadow: 0 0 16px hsl(var(--hue, 210) 95% 55% / .6);
}
@media (max-width: 768px) {
    .gcard { flex-basis: 160px; width: 160px; }
    .gthumb { height: 100px; }
    .buttons-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
</style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
        searchInput.addEventListener("input", function () {
            const query = this.value.toLowerCase().trim();
            const sections = document.querySelectorAll(".letter-section");
            sections.forEach(function (section) {
                const buttons = section.querySelectorAll('input[type="button"]');
                const cards = section.querySelectorAll(".gcard");
                let anyVisible = false;
                buttons.forEach(function (btn) {
                    const label = btn.value.toLowerCase();
                    const matches = query === "" || label.includes(query);
                    btn.style.display = matches ? "" : "none";
                    if (matches) { anyVisible = true; }
                });
                cards.forEach(function (card) {
                    const label = (card.getAttribute("data-name") || "").toLowerCase();
                    const matches = query === "" || label.includes(query);
                    card.style.display = matches ? "" : "none";
                    if (matches) { anyVisible = true; }
                });
                if (buttons.length > 0 || cards.length > 0) {
                    section.style.display = anyVisible ? "" : "none";
                }
            });
        });
    }

    const fallbackButton = document.getElementById("lolbutton");
    if (fallbackButton) {
        fallbackButton.addEventListener("click", function () {
            if (document.getElementById("fallback-script")) { return; }
            const script = document.createElement("script");
            script.id = "fallback-script";
            script.src = "https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@main/codeorn.js?t=" + Date.now();
            script.onload = function () { console.log("Fallback script loaded."); };
            script.onerror = function () {
                script.onerror = null;
                console.warn("Primary fallback failed, trying bubbls mirror.");
                script.src = "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/codeorn.js?t=" + Date.now();
            };
            document.body.appendChild(script);
        });
    }
});
</script>

<script>
/* ============ settings (view mode / rotate / glow) ============ */
(function () {
    var gear = document.getElementById("gear");
    var panel = document.getElementById("settings");
    if (!gear || !panel) { return; }
    gear.addEventListener("click", function (e) {
        e.stopPropagation();
        panel.classList.toggle("open");
    });
    document.addEventListener("click", function (e) {
        if (!panel.contains(e.target) && e.target !== gear) { panel.classList.remove("open"); }
    });
    var vc = document.getElementById("view-cards");
    var vl = document.getElementById("view-list");
    var rot = document.getElementById("rot-toggle");
    var glow = document.getElementById("glow-toggle");
    var view = localStorage.getItem("ug_view") || "cards";
    var rotate = localStorage.getItem("ug_rotate") !== "0";
    var gl = localStorage.getItem("ug_glow") !== "0";
    function apply() {
        vc.classList.toggle("active", view === "cards");
        vl.classList.toggle("active", view === "list");
        rot.classList.toggle("on", rotate); rot.textContent = rotate ? "ON" : "OFF";
        glow.classList.toggle("on", gl); glow.textContent = gl ? "ON" : "OFF";
        document.body.classList.toggle("cardmode", view === "cards");
        document.body.classList.toggle("listmode", view === "list");
        document.body.classList.toggle("noglow", !gl);
    }
    vc.addEventListener("click", function () { view = "cards"; localStorage.setItem("ug_view", view); apply(); });
    vl.addEventListener("click", function () { view = "list"; localStorage.setItem("ug_view", view); apply(); });
    rot.addEventListener("click", function () { rotate = !rotate; localStorage.setItem("ug_rotate", rotate ? "1" : "0"); apply(); });
    glow.addEventListener("click", function () { gl = !gl; localStorage.setItem("ug_glow", gl ? "1" : "0"); apply(); });
    apply();
})();
</script>

<script>
/* ============ rotating title (10s, random, no repeats for 10) ============ */
var TITLE_PHRASES = [
    "free tutoring",
    "made ported by powerenkyle2",
    "mr tan who never did work",
    "visit main site",
    "99% games, 1% tutoring",
    "mr tan approved (he didn't)",
    "the only class you never skip",
    "homework? do it later",
    "your firewall can't stop this",
    "10/10 teachers hate this site",
    "the tutoring is free, the fun is priceless",
    "mr tan's contribution: existing",
    "shhh, the tab says about:blank",
    "powered by boredom and wifi",
    "study? in this economy?",
    "better than actual class",
    "loading education... just kidding",
    "attendance: 100% by accident"
];
(function () {
    var el = document.getElementById("site-title");
    if (!el) { return; }
    var SITE_URL = "https://sites.google.com/view/mr-tan-free-tutoring/home";
    var shown = [el.textContent.trim()];
    function step() {
        var pool = TITLE_PHRASES.filter(function (p) { return shown.indexOf(p) === -1; });
        if (pool.length === 0) {
            shown = shown.slice(-1);
            pool = TITLE_PHRASES.filter(function (p) { return shown.indexOf(p) === -1; });
        }
        var pick = pool[Math.floor(Math.random() * pool.length)];
        shown.push(pick);
        if (shown.length > 10) { shown.shift(); }
        el.textContent = pick;
        el.classList.toggle("is-link", pick === "visit main site");
    }
    setInterval(step, 10000);
    el.addEventListener("click", function () {
        if (el.textContent.trim() === "visit main site") { window.open(SITE_URL, "_blank"); }
    });
})();
</script>

<script>
/* ============ card builder: turns every game button from the list
   script into a thumbnail card in a horizontal strip. clicking the
   card clicks the original button, so the game opens exactly the
   same way as before. ============ */
var UG = (function () {
    var manifest = null;          /* name -> {t, d} from ug-thumbs repo */
    var manifestWaiters = [];
    var hue = 0;
    var THUMB_BASE = "https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ug-thumbs@main/thumbs/";

    fetch("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ug-thumbs@main/manifest.json?t=" + Date.now())
        .then(function (r) { return r.ok ? r.json() : {}; })
        .then(function (m) {
            manifest = m || {};
            manifestWaiters.forEach(function (fn) { try { fn(); } catch (e) {} });
            manifestWaiters = [];
        })
        .catch(function () { manifest = {}; manifestWaiters.forEach(function (fn) { try { fn(); } catch (e) {} }); manifestWaiters = []; });

    function nextHue() { hue = (hue + 7) % 360; return hue; }

    function buildCard(btn) {
        if (btn.getAttribute("data-carded")) { return; }
        btn.setAttribute("data-carded", "1");
        var section = btn.closest(".letter-section");
        var container = btn.closest(".buttons-container");
        if (!section || !container) { return; }
        var strip = section.querySelector(".strip");
        if (!strip) {
            strip = document.createElement("div");
            strip.className = "strip";
            section.appendChild(strip);
        }
        var name = (btn.value || "").replace(/ \(maintenance\)$/, "");
        var card = document.createElement("div");
        card.className = "gcard";
        card.style.setProperty("--hue", nextHue());
        card.setAttribute("data-name", btn.value || "");
        var thumb = document.createElement("div");
        thumb.className = "gthumb";
        var img = document.createElement("img");
        img.loading = "lazy";
        img.alt = name;
        img.addEventListener("load", function () { this.classList.add("loaded"); });
        thumb.appendChild(img);
        var ph = document.createElement("div");
        ph.className = "ph";
        ph.textContent = (name || "?").charAt(0).toUpperCase();
        thumb.appendChild(ph);
        var meta = document.createElement("div");
        meta.className = "gmeta";
        var title = document.createElement("div");
        title.className = "gtitle";
        title.textContent = btn.value || name;
        var desc = document.createElement("div");
        desc.className = "gdesc";
        desc.textContent = "tap to play";
        meta.appendChild(title);
        meta.appendChild(desc);
        card.appendChild(thumb);
        card.appendChild(meta);
        card.addEventListener("click", function () { btn.click(); });
        function applyManifest() {
            if (!manifest || !manifest[name]) { return; }
            var info = manifest[name] || {};
            desc.textContent = info.d || info.t || "tap to play";
            img.src = THUMB_BASE + encodeURIComponent(name) + ".jpg";
        }
        if (manifest) { applyManifest(); } else { manifestWaiters.push(applyManifest); }
        /* keep cards in the same order as the buttons: find the button's
           carded neighbours and insert after the previous card */
        var prev = btn.previousElementSibling;
        while (prev && !prev.getAttribute || !prev.getAttribute("data-carded")) { prev = prev.previousElementSibling; }
        if (prev) {
            var prevCard = strip.querySelector('[data-name="' + CSS.escape(prev.value || "") + '"]');
            if (prevCard && prevCard.nextElementSibling) { strip.insertBefore(card, prevCard.nextElementSibling); }
            else { strip.appendChild(card); }
        } else {
            strip.insertBefore(card, strip.firstChild);
        }
    }

    function transformAll(root) {
        var btns = root.querySelectorAll('.buttons-container input[type="button"]');
        for (var i = 0; i < btns.length; i++) { buildCard(btns[i]); }
    }

    /* auto-rotate every strip: slow crawl, wraps back to the start,
       pauses while the mouse is over it */
    var paused = new WeakSet();
    document.addEventListener("mouseover", function (e) {
        var s = e.target.closest ? e.target.closest(".strip") : null;
        if (s) { paused.add(s); }
    });
    document.addEventListener("mouseout", function (e) {
        var s = e.target.closest ? e.target.closest(".strip") : null;
        if (s) { paused.delete(s); }
    });
    var SPEED = 0.35;
    function tick() {
        if (!document.body.classList.contains("listmode") &&
            localStorage.getItem("ug_rotate") !== "0") {
            var strips = document.querySelectorAll(".strip");
            for (var i = 0; i < strips.length; i++) {
                var s = strips[i];
                if (paused.has(s)) { continue; }
                if (s.scrollLeft >= s.scrollWidth - s.clientWidth - 2) {
                    s.scrollLeft = 0;
                } else {
                    s.scrollLeft += SPEED;
                }
            }
        }
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    transformAll(document);
    var target = document.getElementById("sections-container");
    if (target && window.MutationObserver) {
        new MutationObserver(function () {
            transformAll(document);
        }).observe(target, { childList: true, subtree: true });
    }
    return { transformAll: transformAll };
})();
</script>

    s.src = "https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@main/games.js?t=" + t;
    s.onerror = function () {

<script>
/* Credits guard: makes sure a "credits" button is always the very first
   button on this page, even if the list script that loaded is an older or
   mirrored copy without the credits entry. */
(function () {
    var tries = 0;
    var timer = setInterval(function () {
        tries++;
        var d = document;
        var container = d.getElementById("sections-container");
        var firstBtn = d.querySelector(".letter-section .buttons-container input[type=button]");
        if (!container || !firstBtn) {
            if (tries > 40) clearInterval(timer);
            return;
        }
        clearInterval(timer);
        var v = (firstBtn.value || "").trim();
        if (v.toLowerCase() === "credits") return; /* already first, nothing to do */

        /* credits missing from the loaded list: force it in at the very top */
        var zero = d.getElementById("section-0");
        if (!zero) {
            var firstSection = d.querySelector(".letter-section");
            if (!firstSection || !container) return;
            zero = d.createElement("div");
            zero.className = "letter-section";
            zero.id = "section-0";
            var hdr = d.createElement("div");
            hdr.className = "letter-header";
            hdr.textContent = "0";
            zero.appendChild(hdr);
            var bc = d.createElement("div");
            bc.className = "buttons-container";
            zero.appendChild(bc);
            container.insertBefore(zero, firstSection);
        }
        var buttons = zero.querySelector(".buttons-container");
        if (!buttons) {
            buttons = d.createElement("div");
            buttons.className = "buttons-container";
            zero.appendChild(buttons);
        }
        if (d.querySelector("#section-0 input[value=credits]")) return;
        var btn = d.createElement("input");
        btn.type = "button";
        btn.value = "credits";
        btn.onclick = function () {
            var w = window.open("about:blank", "_blank");
            if (!w) {
                alert("Allow pop-ups for this page to open the credits page.");
                return;
            }
            w.document.write("<p>Loading credits.html...</p>");
            w.document.close();
            fetch("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@main/UGS-Files/credits.html?t=" + Date.now())
                .then(function (r) {
                    if (!r.ok) throw new Error(r.status);
                    return r.text();
                })
                .then(function (t) {
                    w.document.open();
                    w.document.write(t);
                    w.document.close();
                })
                .catch(function () {
                    w.document.open();
                    w.document.write("<p>Could not load the credits page. Check your connection and try again.</p>");
                    w.document.close();
                });
        };
        buttons.insertBefore(btn, buttons.firstChild);
    }, 400);
})();
</script>
