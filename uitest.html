<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.png">
<title>Home</title>
<style>
:root {
    --blue: #1a73e8;
    --ink: #e8eaed;
    --muted: #9aa3b2;
    --line: #232838;
    --bg: #0b0d12;
    --card: #13161f;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
}
.appbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    background: #0d1017;
    padding: 8px 16px;
    border-bottom: 1px solid var(--line);
}
.material {
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer; flex-shrink: 0;
}
.material:hover { background: #1c2130; }
svg.icon { width: 22px; height: 22px; fill: #9aa3b2; }
.avatar {
    margin-left: auto;
    width: 34px; height: 34px; border-radius: 50%;
    background: linear-gradient(135deg, #4285f4, #a46bff);
    color: #fff; font-size: 15px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 12px rgba(79,172,254,.4);
    user-select: none;
}
.hero {
    max-width: 1160px; margin: 26px auto 4px; padding: 0 20px;
    text-align: center;
}
.site-title {
    font-size: clamp(26px, 4vw, 40px);
    font-weight: 600;
    line-height: 1.25;
    min-height: 1.25em;
    background: linear-gradient(90deg, #ff5f6d, #ffc371, #f7ff47, #47f0a3, #4facfe, #a46bff, #ff5f6d);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow-slide 6s linear infinite;
    filter: drop-shadow(0 0 14px rgba(164,107,255,.35));
    cursor: default; user-select: none;
    transition: filter .25s ease;
}
.site-title.is-link {
    cursor: pointer;
    filter: drop-shadow(0 0 22px rgba(71,240,163,.65));
}
@keyframes rainbow-slide { to { background-position: 300% 0; } }
.credits {
    margin-top: 8px;
    font-size: 13px; color: var(--muted);
}
.toolbar {
    display: flex; align-items: center; gap: 14px;
    max-width: 1160px; margin: 20px auto 6px; padding: 0 20px;
    flex-wrap: wrap;
}
.search-glow {
    flex: 1; min-width: 220px; max-width: 560px;
    padding: 2px; border-radius: 27px;
    background: conic-gradient(from 0deg, #ff5f6d, #ffc371, #f7ff47, #47f0a3, #4facfe, #a46bff, #ff5f6d);
    animation: rainbow-spin 5s linear infinite;
    box-shadow: 0 0 18px rgba(164,107,255,.25);
}
@keyframes rainbow-spin { to { filter: hue-rotate(360deg); } }
.searchbox {
    height: 44px; border-radius: 25px;
    background: #12161f;
    display: flex; align-items: center; gap: 10px;
    padding: 0 16px;
}
.searchbox svg { fill: var(--muted); width: 20px; height: 20px; flex-shrink: 0; }
#searchInput {
    border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--ink); width: 100%;
}
#searchInput::placeholder { color: #6b7385; }
#lolbutton {
    height: 38px; padding: 0 18px;
    border: 1px solid rgba(255,255,255,.14); border-radius: 19px;
    background: #12161f; color: #c9d2e0;
    font-size: 13px; font-weight: 500; cursor: pointer;
}
#lolbutton:hover { border-color: #a46bff; box-shadow: 0 0 12px rgba(164,107,255,.45); color: #fff; }
.layout {
    display: flex; gap: 14px;
    max-width: 1160px; margin: 0 auto; padding: 0 20px 40px;
}
#sidebar {
    position: sticky; top: 84px;
    width: 44px; flex-shrink: 0;
    display: flex; flex-direction: column; align-items: center;
    gap: 4px; max-height: calc(100vh - 100px);
    overflow-y: auto; padding-bottom: 8px;
}
#sidebar::-webkit-scrollbar { width: 0; }
.sidebar-btn {
    width: 34px; height: 34px; border: none; border-radius: 50%;
    background: transparent; color: var(--muted);
    font-size: 13px; font-weight: 500; cursor: pointer;
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    --hue: 220;
}
.sidebar-btn:hover {
    background: hsl(var(--hue) 90% 55% / .16);
    color: hsl(var(--hue) 95% 72%);
    box-shadow: 0 0 10px hsl(var(--hue) 90% 55% / .35);
}
.sidebar-btn.empty { opacity: .28; cursor: default; }
.sidebar-btn.empty:hover { background: transparent; color: var(--muted); box-shadow: none; }
#sections-container { flex: 1; min-width: 0; }
.letter-section {
    background: var(--card);
    border-radius: 12px;
    border: 1px solid var(--line);
    margin-bottom: 22px;
    overflow: hidden;
    box-shadow: 0 0 10px rgba(0,0,0,.25);
}
.letter-section.empty { opacity: .55; }
.letter-header {
    min-height: 56px;
    display: flex; align-items: center;
    padding: 0 22px;
    color: #fff;
    font-size: 22px; font-weight: 500;
    letter-spacing: .5px;
    text-shadow: 0 0 10px rgba(255,255,255,.35);
}
#sections-container .letter-section:nth-of-type(7n+1) .letter-header { background: linear-gradient(135deg,#7986cb,#303f9f); }
#sections-container .letter-section:nth-of-type(7n+2) .letter-header { background: linear-gradient(135deg,#4285f4,#1a56d6); }
#sections-container .letter-section:nth-of-type(7n+3) .letter-header { background: linear-gradient(135deg,#34a853,#0d652d); }
#sections-container .letter-section:nth-of-type(7n+4) .letter-header { background: linear-gradient(135deg,#f9ab00,#e37400); }
#sections-container .letter-section:nth-of-type(7n+5) .letter-header { background: linear-gradient(135deg,#a142f4,#6f2db8); }
#sections-container .letter-section:nth-of-type(7n+6) .letter-header { background: linear-gradient(135deg,#26a69b,#00796b); }
#sections-container .letter-section:nth-of-type(7n+7) .letter-header { background: linear-gradient(135deg,#f28b82,#c5221f); }
.buttons-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    grid-auto-rows: 42px;
    gap: 10px;
    padding: 16px 22px 20px;
}
.buttons-container input[type="button"] {
    width: 100%; height: 100%;
    background: #12161f;
    border: 1px solid hsl(var(--hue, 210) 95% 60% / .55);
    border-radius: 10px;
    padding: 0 14px;
    font-size: 13px;
    color: var(--ink);
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    --hue: 210;
    box-shadow: 0 0 7px hsl(var(--hue, 210) 95% 55% / .22), inset 0 0 6px hsl(var(--hue, 210) 95% 50% / .08);
    transition: box-shadow .18s ease, background .18s ease, border-color .18s ease;
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
}
.buttons-container input[type="button"]:hover {
    background: hsl(var(--hue, 210) 90% 55% / .13);
    border-color: hsl(var(--hue, 210) 95% 68%);
    box-shadow: 0 0 16px hsl(var(--hue, 210) 95% 55% / .6), inset 0 0 10px hsl(var(--hue, 210) 95% 50% / .18);
}
.empty-message {
    grid-column: 1 / -1;
    color: var(--muted); font-style: italic;
    font-size: 13px; text-align: center; padding: 14px 0;
}
@media (max-width: 768px) {
    #sidebar { display: none; }
    .hero { margin-top: 18px; }
    .buttons-container { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
</style>
</head>
<body>

<div class="appbar">
    <div class="material"><svg class="icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></div>
    <div class="avatar">K</div>
</div>

<div class="hero">
    <h1 id="site-title" class="site-title">free tutoring</h1>
    <p class="credits">made ported by powerenkyle2 and mr tan who never did work</p>
</div>

<div class="toolbar">
    <div class="search-glow">
        <div class="searchbox">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" placeholder="find the game to your heart's desire" id="searchInput">
        </div>
    </div>
    <button id="lolbutton">Click to load if it isn't loading</button>
</div>

<div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div id="sections-container"></div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
        searchInput.addEventListener("input", function () {
            const query = this.value.toLowerCase().trim();
            const sections = document.querySelectorAll(".letter-section");
            sections.forEach(function (section) {
                const buttons = section.querySelectorAll('input[type="button"]');
                let anyVisible = false;
                buttons.forEach(function (btn) {
                    const label = btn.value.toLowerCase();
                    const matches = query === "" || label.includes(query);
                    btn.style.display = matches ? "" : "none";
                    if (matches) { anyVisible = true; }
                });
                if (buttons.length > 0) {
                    section.style.display = anyVisible ? "" : "none";
                }
            });
        });
    }

    const fallbackButton = document.getElementById("lolbutton");
    if (fallbackButton) {
        fallbackButton.addEventListener("click", function () {
            if (document.getElementById("fallback-script")) { return; }
            const script = document.createElement("script");
            script.id = "fallback-script";
            script.src = "https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@main/codeorn.js?t=" + Date.now();
            script.onload = function () { console.log("Fallback script loaded."); };
            script.onerror = function () {
                script.onerror = null;
                console.warn("Primary fallback failed, trying bubbls mirror.");
                script.src = "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/codeorn.js?t=" + Date.now();
            };
            document.body.appendChild(script);
        });
    }
});
</script>

<script>
/* rainbow glow painter: gives every game button (and sidebar chip) its own
   hue so the grid glows in the colours of the rainbow. runs again whenever
   the list script adds more buttons. */
(function () {
    var idx = 0;
    function paint(root) {
        var els = root.querySelectorAll('.buttons-container input[type="button"], .sidebar-btn:not(.empty)');
        for (var i = 0; i < els.length; i++) {
            if (!els[i].style.getPropertyValue("--hue")) {
                els[i].style.setProperty("--hue", ((idx * 7) % 360));
                idx++;
            }
        }
    }
    paint(document);
    var pending = false;
    var target = document.getElementById("sections-container");
    if (target && window.MutationObserver) {
        new MutationObserver(function () {
            if (pending) { return; }
            pending = true;
            setTimeout(function () { pending = false; paint(document); }, 120);
        }).observe(target, { childList: true, subtree: true });
    }
})();
</script>

<script>
/* rotating title - changes every 10 seconds, random, never twice in a row,
   and a phrase only comes back after 10 different phrases have been shown.
   "visit main site" is clickable and opens the main Google site. */
var TITLE_PHRASES = [
    "free tutoring",
    "made ported by powerenkyle2",
    "mr tan who never did work",
    "visit main site",
    "99% games, 1% tutoring",
    "mr tan approved (he didn't)",
    "the only class you never skip",
    "homework? do it later",
    "your firewall can't stop this",
    "10/10 teachers hate this site",
    "the tutoring is free, the fun is priceless",
    "mr tan's contribution: existing",
    "shhh, the tab says about:blank",
    "powered by boredom and wifi",
    "study? in this economy?",
    "better than actual class",
    "loading education... just kidding",
    "attendance: 100% by accident"
];
(function () {
    var el = document.getElementById("site-title");
    if (!el) { return; }
    var SITE_URL = "https://sites.google.com/view/mr-tan-free-tutoring/home";
    var shown = [el.textContent.trim()];
    function step() {
        var pool = TITLE_PHRASES.filter(function (p) { return shown.indexOf(p) === -1; });
        if (pool.length === 0) {
            shown = shown.slice(-1);
            pool = TITLE_PHRASES.filter(function (p) { return shown.indexOf(p) === -1; });
        }
        var pick = pool[Math.floor(Math.random() * pool.length)];
        shown.push(pick);
        if (shown.length > 10) { shown.shift(); }
        el.textContent = pick;
        el.classList.toggle("is-link", pick === "visit main site");
    }
    setInterval(step, 10000);
    el.addEventListener("click", function () {
        if (el.textContent.trim() === "visit main site") { window.open(SITE_URL, "_blank"); }
    });
})();
</script>

<script>
(function () {
    var t = Date.now();
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@main/games.js?t=" + t;
    s.onerror = function () {
        s.onerror = null;
        console.warn("Main list failed, trying bubbls mirror.");
        s.src = "https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile@main/games.js?t=" + t;
    };
    document.body.appendChild(s);
})();
</script>

<script>
/* Credits guard: makes sure a "credits" button is always the very first
   button on this page, even if the list script that loaded is an older or
   mirrored copy without the credits entry. */
(function () {
    var tries = 0;
    var timer = setInterval(function () {
        tries++;
        var d = document;
        var container = d.getElementById("sections-container");
        var firstBtn = d.querySelector(".letter-section .buttons-container input[type=button]");
        if (!container || !firstBtn) {
            if (tries > 40) clearInterval(timer);
            return;
        }
        clearInterval(timer);
        var v = (firstBtn.value || "").trim();
        if (v.toLowerCase() === "credits") return; /* already first, nothing to do */

        /* credits missing from the loaded list: force it in at the very top */
        var zero = d.getElementById("section-0");
        if (!zero) {
            var firstSection = d.querySelector(".letter-section");
            if (!firstSection || !container) return;
            zero = d.createElement("div");
            zero.className = "letter-section";
            zero.id = "section-0";
            var hdr = d.createElement("div");
            hdr.className = "letter-header";
            hdr.textContent = "0";
            zero.appendChild(hdr);
            var bc = d.createElement("div");
            bc.className = "buttons-container";
            zero.appendChild(bc);
            container.insertBefore(zero, firstSection);
        }
        var buttons = zero.querySelector(".buttons-container");
        if (!buttons) {
            buttons = d.createElement("div");
            buttons.className = "buttons-container";
            zero.appendChild(buttons);
        }
        if (d.querySelector("#section-0 input[value=credits]")) return;
        var btn = d.createElement("input");
        btn.type = "button";
        btn.value = "credits";
        btn.onclick = function () {
            var w = window.open("about:blank", "_blank");
            if (!w) {
                alert("Allow pop-ups for this page to open the credits page.");
                return;
            }
            w.document.write("<p>Loading credits.html...</p>");
            w.document.close();
            fetch("https://cdn.jsdelivr.net/gh/yeodaienkyle-afk/ugs-singlefile@main/UGS-Files/credits.html?t=" + Date.now())
                .then(function (r) {
                    if (!r.ok) throw new Error(r.status);
                    return r.text();
                })
                .then(function (t) {
                    w.document.open();
                    w.document.write(t);
                    w.document.close();
                })
                .catch(function () {
                    w.document.open();
                    w.document.write("<p>Could not load the credits page. Check your connection and try again.</p>");
                    w.document.close();
                });
        };
        buttons.insertBefore(btn, buttons.firstChild);
    }, 400);
})();
</script>

</body>
</html>
