*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:20px;
  background:radial-gradient(1200px 600px at 50% -10%,#eef2f9 0%,#e6eaf2 45%,#dfe4ee 100%);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;color:#101828}
.calc{width:100%;max-width:360px;background:#fff;border-radius:26px;padding:18px;
  box-shadow:0 24px 60px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.06);border:1px solid #e7eaf0}
.brand{display:flex;align-items:center;gap:8px;padding:2px 6px 12px;color:#667085;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%;background:#2f6fed}
.screen{background:#f7f9fc;border:1px solid #e9edf4;border-radius:18px;padding:16px 16px 12px;margin-bottom:14px;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.expr{min-height:20px;font-size:15px;color:#98a2b3;text-align:right;word-break:break-all;line-height:1.3}
.out{font-size:40px;font-weight:700;text-align:right;letter-spacing:-.02em;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{appearance:none;border:0;border-radius:16px;height:62px;font-size:22px;font-weight:600;
  background:#f2f4f8;color:#101828;cursor:pointer;transition:transform .06s ease,background .15s ease;user-select:none}
button:hover{background:#e9edf4}
button:active{transform:scale(.96);background:#dfe5ee}
button.fn{background:#eaeff8;color:#2f6fed}
button.op{background:#e8f0ff;color:#1d4ed8}
button.eq{background:#2f6fed;color:#fff}
button.eq:hover{background:#2560d8}
button.eq:active{background:#1d4ed8}
.hint{padding:12px 6px 2px;text-align:center;color:#98a2b3;font-size:11px}
@media (max-width:380px){button{height:56px;font-size:20px}.out{font-size:34px}}
</style>
